# Flutter port branch — additive-only guard. See docs/flutter-port-plan.html §08.
#
# NEVER add a `tags:` trigger here. A Flutter workflow that fires on `v*` would
# attach a half-finished Dart bundle to a real Slint release.
name: flutter-branch

on:
  push:
    branches: [flport]

permissions:
  contents: read

jobs:
  frozen-tree-guard:
    if: github.ref == 'refs/heads/flport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: No file that exists on beta may be modified or deleted
        run: |
          git fetch --no-tags origin beta
          CHANGED=$(git diff --diff-filter=MD --name-only origin/beta...HEAD)
          # The allowlist starts empty and grows only by review. When the bridge
          # crate joins the root workspace (phase 3), `Cargo.toml` goes here and
          # nothing else ever does.
          ALLOW=''
          VIOLATIONS=$(comm -23 <(echo "$CHANGED" | sort -u) <(echo "$ALLOW" | sort -u))
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::branch modified frozen files:"; echo "$VIOLATIONS"; exit 1
          fi
          echo "additive only — $(echo "$CHANGED" | grep -c . || true) frozen files touched"
