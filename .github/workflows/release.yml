# Full self-contained release builds: Linux (deb / rpm / AppImage / tar.gz),
# Windows (installer + portable zip), macOS (dmg). Every external tool the app
# shells out to (ffmpeg, ffprobe, yt-dlp, rclone, whisper-cli + model, exiftool,
# mpv) is bundled — nothing resolves from the target machine's PATH.
#
# Trigger: version tags (v*) publish a GitHub Release; manual dispatch builds
# artifacts without publishing.

name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The final tulipix-app codegen/link peaks past the 16 GB runner (the app
      # grew since v0.3.0) and the job is silently OOM-killed (exit 143, no log).
      # Give it a big swapfile for headroom, and reclaim disk for both the swap
      # file and the release target dir. swapoff first — the runner's own
      # /swapfile is busy, so ours goes on /mnt (its large scratch disk).
      - name: Free disk + swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift \
            /usr/local/.ghcup /usr/share/miniconda /opt/az \
            /usr/local/lib/node_modules 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          sudo fallocate -l 30G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=30720
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Swapping is the point here — let the kernel use it before it starts
          # killing processes, and keep some file cache rather than dropping the
          # pages rustc is about to re-read.
          #
          # overcommit_memory=1: heuristic mode refuses a single allocation
          # bigger than roughly RAM + swap/2, and rustc's LTO step asks for
          # exactly that shape of block — it dies with "memory allocation of N
          # bytes failed" while gigabytes of swap sit unused. Mode 1 always says
          # yes and lets the pages land in the swapfile above.
          sudo sysctl -w vm.swappiness=100 vm.vfs_cache_pressure=50 vm.overcommit_memory=1 || true
          echo "=== mem/disk after ==="; free -h; df -h / /mnt

      - name: System deps (libmpv link + skia/gl build deps + mpv to bundle)
        run: |
          sudo apt-get update
          # mold: the committed .cargo/config.toml links Linux builds with it.
          # No libgtk-3-dev: rfd talks to xdg-desktop-portal and the tray is ksni
          # (D-Bus StatusNotifierItem), so nothing in the Linux build links GTK.
          # clang + libclang-dev + python3: skia-bindings (slint renderer-skia)
          # builds Skia from source with GN/Ninja when no prebuilt binary matches
          # the feature set — that build REQUIRES clang (GN toolchain) and libclang
          # (bindgen). Their absence is what failed the Skia step ~7 min in.
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev mpv mold cmake ninja-build libdbus-1-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libwayland-dev \
            clang libclang-dev llvm-dev python3 lld time

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}";
          else V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Fetch bundled tools (manifest-pinned)
        run: cargo run -p fetch-resources

      - name: Build whisper-cli (static, pinned v1.9.1)
        run: |
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper.cpp/build --target whisper-cli
          install -m755 /tmp/whisper.cpp/build/bin/whisper-cli resources/bin/linux-x86_64/whisper-cli

      - name: "Build (full: embedded-mpv + skia)"
        # Force skia-bindings to DOWNLOAD its prebuilt binary (as win/macOS do)
        # instead of silently falling back to a 40-min source build that exhausts
        # the runner and kills the job with no log. Prebuilts for
        # x86_64-unknown-linux-gnu are published for our feature combo. If a combo
        # ever mismatches, this fails fast (~2 min) with the expected filename
        # rather than dying at ~60 min.
        env:
          FORCE_SKIA_BINARIES_DOWNLOAD: "1"
          # This job is the one that OOMs (exit 143, "runner received a shutdown
          # signal", no error in the log — the VM itself dies). macOS builds the
          # same crate with the same features on a 7 GB M1 runner, so the peak is
          # not rustc across the workspace: it is the single final unit, where
          # `lto = "fat"` + `codegen-units = 1` (release profile, right for a
          # shipped binary) merges the whole program — skia and all — into one
          # LLVM module and one lld invocation.
          #
          #  1. mold -> lld: mold holds the whole link in RAM. (RUSTFLAGS
          #     overrides the committed .cargo/config mold flag.)
          #  2. lld --threads=1: a threaded link keeps per-thread arenas alive.
          #  3. thin LTO + 256 codegen units, Linux-only and via env so the
          #     committed profile stays fat for local release builds. Thin LTO
          #     optimizes module-at-a-time instead of loading the program at
          #     once — this is the actual peak, and the one lever big enough to
          #     matter. Costs a little binary size and inlining. 256 rather
          #     than 16 because the same 16 killed the Windows job inside a
          #     single tulipix-ui codegen unit this cycle; the peak is one LLVM
          #     module, so smaller modules are the lever.
          #  4. -j1: one crate at a time on the way there.
          # opt-level stays at the profile's "s": smaller code is less for the
          # LTO step and the linker to chew on, and it is what macOS survives on.
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--threads=1"
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "false"
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
        run: |
          # A silent 143 leaves nothing to work from, so log memory while it
          # runs: the last sample before the kill says whether it was RAM, swap
          # or disk, and `time -v` reports the peak of the build itself.
          ( while :; do
              echo "[mem $(date -u +%H:%M:%S)] $(free -m | awk '/^Mem:/{print "used="$3"M free="$4"M"} /^Swap:/{print "swap="$3"M"}' | tr '\n' ' ')" \
                   "top=$(ps -eo rss,comm --sort=-rss | awk 'NR==2{printf "%s(%dM)", $2, $1/1024}')"
              sleep 30
            done ) &
          WATCH=$!
          trap 'kill $WATCH 2>/dev/null || true' EXIT
          /usr/bin/time -v cargo build --release --locked -p tulipix-app --features full,ai-onnx

      - name: Strip
        run: strip target/release/tulipix

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Package .deb
        run: cargo deb -p tulipix-app --no-build --no-strip -o dist/tulipix-${VERSION}-linux-x86_64.deb

      - name: Package .rpm
        run: |
          cargo generate-rpm -p crates/tulipix-app -o dist/tulipix-${VERSION}-linux-x86_64.rpm

      - name: Package AppImage (bundles libmpv + mpv player)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/resources/bin/linux-x86_64
          cp target/release/tulipix AppDir/usr/bin/
          cp /usr/bin/mpv AppDir/usr/bin/
          cp -r resources/bin/linux-x86_64/. AppDir/usr/resources/bin/linux-x86_64/
          curl -sSfL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          export VERSION
          ./linuxdeploy --appdir AppDir \
            -e AppDir/usr/bin/tulipix -e AppDir/usr/bin/mpv \
            -d packaging/linux/tulipix.desktop \
            -i resources/icons/tulipix-256.png --icon-filename tulipix \
            --output appimage
          mv Tulipix-*.AppImage "dist/tulipix-${VERSION}-linux-x86_64.AppImage" 2>/dev/null \
            || mv tulipix-*.AppImage "dist/tulipix-${VERSION}-linux-x86_64.AppImage"

      - name: Package tar.gz (opt layout)
        env:
          # Flip to "1" to also bundle the mpv player + the shared libs the
          # AppImage step already collected (linuxdeploy resolved libmpv and
          # friends into AppDir). Adds ~90 MB; off by default because deb/rpm
          # declare an mpv dependency and most tar.gz users (Arch) have mpv.
          BUNDLE_MPV_IN_TARBALL: "1"
        run: |
          mkdir -p stage/tulipix/resources/bin
          cp target/release/tulipix stage/tulipix/
          cp -r resources/bin/linux-x86_64 stage/tulipix/resources/bin/
          cp packaging/linux/tulipix.desktop resources/icons/tulipix-256.png stage/tulipix/
          if [ "$BUNDLE_MPV_IN_TARBALL" = "1" ] && [ -d AppDir/usr/lib ]; then
            # mpv beside the other tools (tool_bin finds it), its .so deps in
            # lib/, and a launcher that points the loader at them.
            cp AppDir/usr/bin/mpv stage/tulipix/resources/bin/linux-x86_64/
            mkdir -p stage/tulipix/lib
            cp -a AppDir/usr/lib/. stage/tulipix/lib/
            # The bundled mpv is built with RUNPATH '$ORIGIN/../lib', which from
            # resources/bin/linux-x86_64/ means resources/bin/lib — not the lib/
            # directory above. Without this link mpv only resolves its libraries
            # when started through the launcher below, so anyone running the
            # binary or the .desktop entry directly got no playback at all and no
            # error (v0.6.0). A relative symlink costs nothing and makes the
            # bundled mpv self-sufficient however the app was started.
            ln -s ../../lib stage/tulipix/resources/bin/lib
            printf '%s\n' '#!/bin/sh' \
              'DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
              'export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
              'exec "$DIR/tulipix" "$@"' > stage/tulipix/tulipix.sh
            chmod +x stage/tulipix/tulipix.sh
            # The shipped .desktop is the distro one (Exec=tulipix, correct for
            # deb/rpm). This layout needs the launcher, since the app itself
            # links libmpv out of lib/ on hosts that have no system copy.
            sed -i 's|^Exec=tulipix$|Exec=./tulipix.sh|' stage/tulipix/tulipix.desktop
          fi
          tar -C stage -czf dist/tulipix-${VERSION}-linux-x86_64.tar.gz tulipix
          ls -la dist/

      # v0.6.0 shipped a tarball whose bundled mpv could not start: its RUNPATH
      # is '$ORIGIN/../lib' (resources/bin/lib) while the libraries went to
      # <root>/lib, so every playback attempt silently did nothing unless the app
      # was launched through tulipix.sh. Nothing caught it, because "the file is
      # present" was the only thing ever checked. Extract what we are about to
      # publish and make each bundled tool actually run, with no LD_LIBRARY_PATH
      # to paper over a layout mistake.
      - name: Smoke-test the tarball
        run: |
          set -euo pipefail
          rm -rf smoke && mkdir smoke
          tar -xzf "dist/tulipix-${VERSION}-linux-x86_64.tar.gz" -C smoke
          BIN=smoke/tulipix/resources/bin/linux-x86_64
          for tool in ffmpeg ffprobe yt-dlp rclone exiftool; do
            echo "--- $tool"
            env -u LD_LIBRARY_PATH "$BIN/$tool" -version >/dev/null 2>&1 \
              || env -u LD_LIBRARY_PATH "$BIN/$tool" --version >/dev/null 2>&1 \
              || { echo "::error::bundled $tool cannot run from the tarball layout"; exit 1; }
          done
          if [ -x "$BIN/mpv" ]; then
            env -u LD_LIBRARY_PATH "$BIN/mpv" --version >/dev/null \
              || { echo "::error::bundled mpv cannot resolve its libraries"; exit 1; }
          fi
          test -s "smoke/tulipix/resources/bin/linux-x86_64/ggml-tiny-1.0.bin" \
            || echo "::warning::whisper model missing from the tarball"
          echo "tarball smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # lib.exe (import-lib generator) on PATH
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}";
          else V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Fetch bundled tools (ffmpeg, yt-dlp, mpv.exe, whisper, exiftool, rclone, model)
        run: cargo run -p fetch-resources

      - name: mpv player + libmpv dev (GitHub mirror — SourceForge 403s CI IPs)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/zhongfly/mpv-winbuild/releases/latest | ConvertFrom-Json
          $mpv = $rel.assets | Where-Object name -match '^mpv-x86_64-\d'     | Select-Object -First 1
          $dev = $rel.assets | Where-Object name -match '^mpv-dev-x86_64-\d' | Select-Object -First 1
          Write-Host "player: $($mpv.name)`ndev: $($dev.name)"
          curl.exe -sSfL -o mpv.7z $mpv.browser_download_url
          curl.exe -sSfL -o mpv-dev.7z $dev.browser_download_url
          7z x -ompv-pkg mpv.7z
          7z x -ompv-dev mpv-dev.7z
          # bundle the standalone player next to the other tools
          Copy-Item mpv-pkg\mpv.exe resources\bin\windows-x86_64\
          if (Test-Path mpv-pkg\mpv.com) { Copy-Item mpv-pkg\mpv.com resources\bin\windows-x86_64\ }
          # Import lib for the embedded-mpv link. The dev package ships no .def
          # (only a GNU libmpv.dll.a, useless to MSVC), so build the .def from
          # the DLL's real export table — a stale bundled def once missed
          # mpv_render_context_free and broke the final link.
          $dll = Get-ChildItem -Recurse mpv-dev -Filter "*mpv*.dll" | Select-Object -First 1
          $lines = dumpbin /exports $dll.FullName
          $names = $lines | Select-String '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw "export parse failed: $($names.Count) symbols" }
          Set-Content mpv-dev\mpv.def -Encoding ascii -Value ("LIBRARY $($dll.Name)`nEXPORTS")
          Add-Content mpv-dev\mpv.def -Encoding ascii -Value $names
          lib.exe /def:mpv-dev\mpv.def /machine:x64 /out:mpv-dev\mpv.lib
          echo "TULIPIX_MPV_LIB_DIR=$PWD\mpv-dev" >> $env:GITHUB_ENV

      # Windows has no swapon: the ceiling on a single allocation is the commit
      # limit, which is RAM plus the pagefile, and the runner's pagefile is
      # system-managed and small. That is the whole reason v0.7.0's first
      # attempt died with "rustc-LLVM ERROR: out of memory / Allocation failed"
      # on tulipix-ui. Put a fixed 32 GB pagefile on D: — the runner's large
      # scratch disk, and the drive the build itself runs from.
      - name: Pagefile headroom
        shell: pwsh
        run: |
          $sys = Get-CimInstance Win32_ComputerSystem
          if ($sys.AutomaticManagedPagefile) {
            Set-CimInstance -InputObject $sys -Property @{AutomaticManagedPagefile = $false}
          }
          Get-CimInstance Win32_PageFileSetting | Remove-CimInstance -ErrorAction SilentlyContinue
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{
            Name = 'D:\pagefile.sys'; InitialSize = 32768; MaximumSize = 32768
          } -ErrorAction Stop | Out-Null
          Get-CimInstance Win32_PageFileSetting | Format-List Name, InitialSize, MaximumSize
          $os = Get-CimInstance Win32_OperatingSystem
          "commit limit: {0:N0} MB" -f ($os.TotalVirtualMemorySize / 1KB)

      - name: "Build (full: embedded-mpv + skia)"
        env:
          # Same memory story as the linux job. Fat LTO makes every crate emit
          # whole-program bitcode into a single codegen unit, and on the 16 GB
          # runner rustc ran out of memory part way through a large UI crate
          # ("Allocation failed", then STATUS_ILLEGAL_INSTRUCTION). Thin LTO
          # with several codegen units keeps each rustc well under the limit
          # and costs little runtime speed. Set here, not in Cargo.toml, so a
          # local release build still gets the smaller fat-LTO binary.
          #
          # 256 codegen units, not 16: at 16 the OOM was inside the codegen of
          # ONE unit of tulipix-ui, whose generated Slint code grew by several
          # thousand lines this cycle. The peak is one LLVM module, so the lever
          # is how big a module gets — sixteen times smaller each. Thin LTO
          # still inlines across them afterwards, so little is given up.
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "false"
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
        run: cargo build --release --locked -p tulipix-app --features full,ai-onnx

      - name: Assemble dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\app\resources\bin | Out-Null
          Copy-Item target\release\tulipix.exe dist\app\
          Copy-Item -Recurse resources\bin\windows-x86_64 dist\app\resources\bin\windows-x86_64
          # runtime libmpv DLL next to the exe
          Get-ChildItem -Recurse mpv-dev -Filter *mpv*.dll | ForEach-Object { Copy-Item $_.FullName dist\app\ }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\app\* -DestinationPath "dist\tulipix-$env:VERSION-windows-x86_64-portable.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          iscc /DAppVersion=$env:VERSION /DDistDir=$PWD\dist\app packaging\windows\tulipix.iss
          Move-Item packaging\windows\Output\*.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*.exe

  # ── macOS (Apple Silicon) ──────────────────────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: System deps (libmpv to link/bundle + bundler)
        run: brew install mpv dylibbundler ninja

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}";
          else V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Fetch bundled tools
        run: |
          mkdir -p dist
          cargo run -p fetch-resources

      - name: Build whisper-cli (static, pinned v1.9.1)
        run: |
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper.cpp/build --target whisper-cli
          install -m755 /tmp/whisper.cpp/build/bin/whisper-cli resources/bin/macos-aarch64/whisper-cli

      - name: "Build (full: embedded-mpv + skia)"
        env:
          CARGO_BUILD_JOBS: "2"   # cap peak RAM — macos-14 (M1) has ~7 GB
          # The committed profile is fat LTO with ONE codegen unit, so tulipix-ui
          # compiles as a single LLVM module — the exact shape that just OOM'd
          # the 16 GB Windows runner. This one has 7 GB and only survived it
          # because macOS grows swap on demand. Give it the same thin/256 split
          # the other two get rather than wait for the cycle where it doesn't.
          CARGO_PROFILE_RELEASE_DEBUG: "false"
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
        run: |
          export TULIPIX_MPV_LIB_DIR="$(brew --prefix mpv)/lib"
          cargo build --release --locked -p tulipix-app --features full,ai-onnx

      - name: Assemble Tulipix.app
        run: |
          APP=Tulipix.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/resources/bin"
          cp target/release/tulipix "$APP/Contents/MacOS/"
          cp -R resources/bin/macos-aarch64 "$APP/Contents/resources/bin/macos-aarch64"
          # bundle the mpv player binary for out-of-process playback
          cp "$(brew --prefix mpv)/bin/mpv" "$APP/Contents/MacOS/mpv"
          sed "s/APP_VERSION/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # icon: png → icns
          mkdir tulipix.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s resources/icons/tulipix-256.png --out "tulipix.iconset/icon_${s}x${s}.png" >/dev/null
          done
          iconutil -c icns tulipix.iconset -o "$APP/Contents/Resources/tulipix.icns"
          # pull libmpv + its dylib tree into the bundle, rewrite install names
          dylibbundler -od -b -x "$APP/Contents/MacOS/tulipix" \
            -d "$APP/Contents/libs" -p @executable_path/../libs/
          dylibbundler -od -b -x "$APP/Contents/MacOS/mpv" \
            -d "$APP/Contents/libs" -p @executable_path/../libs/
          # ad-hoc sign so Apple Silicon runs it at all (unsigned arm64 won't
          # launch). `--deep` only walks the STANDARD nested-code slots
          # (Frameworks/PlugIns/MacOS) — the bundled tools under
          # Contents/resources/bin are invisible to it and would be killed on
          # exec as unsigned arm64, leaving every bundled tool unusable. Sign
          # each one explicitly first.
          find "$APP/Contents/resources/bin" -type f | while read -r f; do
            file "$f" | grep -q "Mach-O" && codesign --force -s - "$f" || true
          done
          codesign --force -s - "$APP/Contents/MacOS/mpv"
          codesign --force --deep -s - "$APP"

      - name: Package dmg
        run: |
          mkdir -p dist
          hdiutil create -volname Tulipix -srcfolder Tulipix.app -ov -format UDZO \
            "dist/tulipix-${VERSION}-macos-aarch64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/*

  # ── Publish (tags only) ────────────────────────────────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          # Created as a DRAFT: assets upload and notes generate, but the
          # release stays unpublished until reviewed and released by hand.
          draft: true
          body: |
            ## Highlights

            Two whole new sections, a book search inside Books, live TV in
            Videos, and a Transfer that now speaks HTTPS and installs on a
            phone like an app.

            ### Transfer — new section
            The desktop becomes a small web server on your own network. A phone
            opens a URL, enters a PIN or scans the QR, and moves files both
            ways. No internet, no account, nothing installed on the phone.

            - **Send and receive** — a share tray the phone downloads from and
              an inbox it uploads into, with ranged downloads so a 4 GB file
              survives the screen locking.
            - **HTTPS with a certificate the app signs itself**, reachable at
              `tulipix.local` over mDNS. The point is not secrecy on a LAN
              behind a PIN — it is that browsers hand out the camera only on a
              secure origin, which is what the in-page QR scanner needs. A
              trust page walks through installing the app's root once.
            - **Installable phone page** — a real PWA (manifest, service
              worker, icons), tick-to-select lists with select-all, one action
              button per list, frosted segmented tabs, and its own theme
              toggle that overrides the phone's.
            - **Live QR** — the pairing key is single-use and expires in 60
              seconds, so the code on screen is re-minted as it ages instead of
              going dead a minute after the page loads.
            - **Paired devices** live in Connection as round device-type
              buttons, five to a row, each opening what is known about it.
            - **Local-only by construction** — only private address ranges are
              offered and the listener binds the one address on screen, never
              `0.0.0.0`. Filename safety is its own module with its own tests.
            - **Ledger** with sorting on all six columns in SQL over the whole
              history, reveal-in-file-manager for sent rows as well as
              received, and a clear-history dialog that spells out that it
              erases the log, not the files.
            - **Firewall help** for every platform, with the real port and link
              name substituted in — the desktop cannot detect a default-deny
              rule, because the bind succeeds and the packets simply die.

            ### Finances — new section
            Household money, offline. A subscription, a bill and an expense are
            one thing at three points in its life, which is what makes this one
            section rather than nine tools sharing a sidebar entry:
            recurrence → obligation → transaction.

            - **Nine tabs** — accounts, transactions, obligations, recurrences,
              budgets, loans, insights, statements and settings — with a
              sidebar badge for what is due.
            - **Statement import** from CSV and OFX, recurring-charge detection
              over your own history, loan amortisation, and receipt OCR.
            - **Exports** as PDF and spreadsheet.
            - **Live FX** for accounts held in another currency.
            - **The numbers are honest by construction** — all money is integer
              minor units, transfers are not spending, lending is not spending,
              an estimate is never posted as a fact, and the SQL and Rust forms
              of the balance rule are pinned together by a test.
            - **Net worth is deliberately not computed**: liquid and debt are
              both real and shown separately, and their difference would need a
              market valuation the app would have to ask you to guess.
            - No bank sync, no OAuth, no account — same as everything else here.

            ### Books — Genesis search and download
            A sub-page of Books that searches Library Genesis mirrors,
            downloads a chosen record, and rescans so the book appears in My
            Library without a restart.

            - **Mirror selection health-checks by running a real search** —
              mirrors routinely serve a healthy front page while their search
              endpoint fails, so a homepage ping would route you to a broken
              one.
            - **Downloads land in `<Downloads>/Genesis`**, registered as a
              library root rather than mixed into a shelf you arranged.
            - Resumable: cancelling leaves the partial file for the next try.
            - Built on a port of Tomesole (MIT); its 109 tests came with it and
              still pass.

            ### Videos — Live TV and a new host
            - **Live TV** — free-to-air channels from iptv-org, by country,
              region, language or category, parsed from plain playlists with a
              day-long cache. No API, no key, nothing to sign. Your selected
              playlists persist with the rest of your settings.
            - **4KHDHub** joins the Stream host list.
            - Trending no longer empties the vertical-drama slider.
            - Season grouping is rebuilt for shows opened outside of search.

            ### Cloud — connect without editing config files
            - **Provider catalogue** read from `rclone config providers`, so the
              Connect dialog asks for "Region" with a list of regions instead of
              a `key=value` textarea — and stays correct across rclone upgrades,
              because the schema comes from the binary that will run.
            - **Guided connect flow**, including OAuth-style authorise for the
              backends that use it.

            ### Desktop notifications
            The notification sink has always been a stub, so no section has ever
            raised a banner. It now goes through what each OS already ships —
            `notify-send`, `osascript`, a WinRT toast — and falls back to the
            stub on a headless machine. Available to every section, not only
            Finances.

            ### Interface
            - A shared surface component behind cards and panels, with theme and
              page restyling across the app.
            - Fixed-height Transfer cards, so nothing moves when a file is
              chosen or a phone pairs.
            - Home's Quick Actions became Quick Launch, with a Transfer tile.

            ### Fixes
            - **ReplayGain scanning was broken outright** — it queried a column
              that does not hold the path.
            - A NaN in a music sort could abort the process; sorting is total now.
            - Paths and URLs handed to OS shells are escaped.
            - The Advanced settings panel reports only what it actually measures.
            - A bundled binary that cannot start is no longer handed to callers
              as if it could.
            - Photos' dedupe list updates in place instead of swapping the model.
            - A sentence's start is reported where its text actually starts.

            ### Under the hood
            - The Linux tray is served by ksni over D-Bus; the whole GTK stack
              is gone from the Linux build.
            - Two HTTP clients are shared instead of 62 untimed ones being built.
            - Ten dependencies dropped; Transfer, Finances and Genesis each
              ship as a core crate plus a Slint glue crate, and Genesis and
              Finances are behind their own cargo features.
            - CI runs the test suite, scoped lints and the per-OS code, and
              smoke-tests the Linux tarball before it can be published.

