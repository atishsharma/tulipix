# Fast feedback on every push: the test suite, scoped lints, and a compile check
# of the per-OS code that a Linux runner cannot see.
#
# Deliberately not a release build. release.yml already does the heavy
# embedded-mpv + skia builds and takes over an hour; this is meant to finish in
# minutes, so it uses the lean femtovg feature set and skips packaging.

name: ci
on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The committed .cargo/config.toml links x86_64-unknown-linux-gnu with mold,
  # so every Linux job installs it — without it rustc reports
  # "cannot find 'ld'" and nothing builds. Cranelift and sccache are injected by
  # the justfile at the CLI, not here, so they need no handling.
  CARGO_INCREMENTAL: "0"

# No `cargo fmt --check` job. The codebase has a consistent house style that
# default rustfmt disagrees with in 4,494 places — mostly compact one-line
# bodies it wants to explode to four lines. Gating on it would mean either a
# permanently red job or a reformat of the whole workspace, and neither is a
# decision a CI file should make. A tuned rustfmt.toml would be the way in.

jobs:
  # Named packages rather than `--workspace --exclude`, because of how the
  # renderer feature works: slint pulls its winit backend by default, and that
  # backend only compiles when a renderer feature is selected — which happens in
  # tulipix-app. Excluding the app from a workspace build therefore leaves slint
  # with no renderer and fails inside i-slint-backend-winit, in code that is not
  # ours. These 14 crates touch no slint at all and hold ~1,013 of the 1,047
  # tests; the slint-dependent ones are covered by test-ui and check-app below.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: ci-test }
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold libgtk-3-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev
      - run: >
          cargo test -p tulipix-core -p tulipix-videos -p tulipix-music -p tulipix-photos
          -p tulipix-books -p tulipix-tools -p tulipix-cloud -p tulipix-player
          -p tulipix-whisper -p tulipix-ai -p tulipix-mdl -p tulipix-platform
          -p tulipix-plugins -p tulipix-cli

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { key: ci-clippy }
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold libgtk-3-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev
      # Scoped rather than `-D warnings`. Clippy has never run in CI here, so
      # denying every lint would fail on day one and teach everyone to ignore
      # the job. correctness and suspicious are the groups that find real bugs;
      # style and pedantic are opinions this codebase has already answered. Widen
      # once these are green and quiet.
      - run: >
          cargo clippy -p tulipix-core -p tulipix-videos -p tulipix-music -p tulipix-photos
          -p tulipix-books -p tulipix-tools -p tulipix-cloud -p tulipix-player
          -p tulipix-whisper -p tulipix-ai -p tulipix-mdl -p tulipix-platform
          -p tulipix-plugins -p tulipix-cli --all-targets --
          -A warnings -D clippy::correctness -D clippy::suspicious

  # Compile-check the app itself in the lean renderer configuration. `check`
  # rather than `build`: this is about catching type errors in main.rs, and a
  # full link of the app is what makes release.yml slow and memory-hungry.
  check-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: ci-app }
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold libgtk-3-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev
      - run: cargo check -p tulipix-app --no-default-features --features renderer-femtovg

  # The UI-glue crates' own tests (~30). They need a renderer selected, which
  # only tulipix-app's features can do, so the app is built alongside them and
  # its default embedded-mpv is dropped — that would want libmpv on the runner.
  test-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: ci-ui }
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold libgtk-3-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev
      - run: >
          cargo test -p tulipix-sec-videos -p tulipix-sec-books -p tulipix-sec-music
          -p tulipix-app --no-default-features --features tulipix-app/renderer-femtovg

  # tulipix-platform is where the per-OS shell integration lives: the AppleScript
  # trash call, the PowerShell one, explorer.exe launches, assoc/ftype. All of it
  # is behind cfg(target_os), so a Linux build compiles none of it — the shell
  # escaping fixes could regress and nothing on Linux would notice. One small
  # crate per OS is cheap and covers exactly that gap.
  check-os-branches:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with:
          # Quoted/block form: a `${{ }}` inside a YAML flow mapping parses `{{`
          # as a nested mapping and breaks the file.
          key: ci-os-${{ matrix.os }}
      - run: >
          cargo clippy -p tulipix-platform --all-targets --
          -A warnings -D clippy::correctness -D clippy::suspicious
      - run: cargo test -p tulipix-platform
