name: tulipix
description: Tulipix desktop — Flutter shell over the frozen Rust domain crates.
publish_to: none
version: 1.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # The generated FFI layer imports this. Its version must match the
  # `flutter_rust_bridge` crate version in crates/tulipix-bridge/Cargo.toml.
  flutter_rust_bridge: 2.13.0
  # Rust enums that carry data generate as `@freezed sealed class` on the Dart
  # side, so the generated file imports this even though no code here does.
  freezed_annotation: ">=2.4.4 <4.0.0"
  rust_lib_tulipix:
    path: rust_builder
  # libmpv in this process, for both players. The audio deck (Music, Podcasts,
  # Audiobooks, Radio, YouTube) and the video layer are two `Player`s over the
  # same engine — which is why doing both at once cost less than either alone.
  # `media_kit_libs_video` is what bundles libmpv rather than borrowing the
  # distro's; it covers audio-only playback too.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # pdfium in this process, for the Books reader. Replaces rasterising a page
  # to PNG with `pdftoppm` and showing the file: selectable text, real search,
  # continuous zoom. Comics still come through the bridge as extracted images.
  pdfrx: ^2.4.7
  # Native file and folder dialogs, Flutter-team maintained. The bridge used to
  # open three of these through `rfd` and its xdg-portal backend; every other
  # path in the app was typed. See lib/design/pick.dart.
  file_selector: ^1.1.0
  # The other half of "a path is chosen, never typed": dropping a file onto a
  # Tools field fills it. Flutter has no built-in desktop file drop, and this
  # is the small, plugin-only way to get it — GTK drag-dest on Linux.
  desktop_drop: ^0.8.3
  # Neumorphism's icons (lib/design/languages/neumorphism.dart): Tabler's
  # outline set, whose fine strokes read as engraved into the soft sheet. An
  # icon font, so it tree-shakes like Material's.
  flutter_tabler_icons: ^1.43.0
  # Glassmorphism's icons: even outlines stay sharp over blur, where filled or
  # duotone glyphs muddy against the colour behind them.
  lucide_icons_flutter: ^3.1.19
  # Skeuomorphism's and Expressive's icons: Material Symbols Rounded, a
  # variable font whose fill axis Icon.fill and IconTheme drive.
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  # The generator behind the `@freezed sealed class` unions frb emits for Rust
  # enums that carry data (PhotosCmd, PhotosEvent). frb runs build_runner
  # itself at the end of `gen`; neither is imported by hand-written code.
  build_runner: ^2.4.0
  freezed: ^4.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # The app mark (five picks, as ui/page_home.slint) and Welcome's drawn
    # banner, one per theme. Copied for the same reason the font is: Flutter
    # refuses asset paths outside the package. Re-copy from
    # resources/appicons/ and resources/illustrations/ if those change.
    - assets/appicons/
    - assets/illustrations/
    # The blank hardcover mockup the library tiles compose their covers onto
    # (Book3D in ui/page_books.slint) and the open-book mockup the reader's
    # two-page spread lays its columns on, one per reading theme (Book_*.png,
    # 1511x1041). Re-copy from resources/icons/bookhero/ if those change.
    - assets/bookhero/
  fonts:
    # Same variable face the Slint build declares in tokens.slint. Copied
    # rather than referenced: Flutter refuses asset paths outside the package,
    # and a symlink breaks the Windows bundle. Re-copy from
    # resources/fonts/Sora[wght].ttf if that file is ever updated.
    - family: Sora
      fonts:
        - asset: fonts/Sora.ttf
    # Neumorphism's face. Cut to Latin with pyftsubset: the full files carry
    # Japanese and weigh 3.3 MB each, and a CJK title falls back per glyph to
    # the system font. OFL; the licence is fonts/OFL-MPLUSRounded1c.txt.
    - family: MPLUSRounded1c
      fonts:
        - asset: fonts/MPLUSRounded1c-Regular.ttf
        - asset: fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
    # Claymorphism's face. Static instances of the variable file, cut to Latin
    # with pyftsubset. OFL; the licence is fonts/OFL-Fredoka.txt.
    - family: Fredoka
      fonts:
        - asset: fonts/Fredoka-Regular.ttf
        - asset: fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: fonts/Fredoka-Bold.ttf
          weight: 700
    # Claymorphism's icons: Phosphor's Fill font, cut to the 49 glyphs the skin
    # maps. Bundled rather than taken from phosphor_flutter, whose IconData
    # subclass does not compile now that IconData is a final class. MIT; the
    # licence is fonts/LICENSE-Phosphor.txt.
    - family: PhosphorFill
      fonts:
        - asset: fonts/PhosphorFill.ttf
    # Glassmorphism's face. Static weights of the variable file, cut to Latin.
    # OFL; the licence is fonts/OFL-Lexend.txt.
    - family: Lexend
      fonts:
        - asset: fonts/Lexend-Light.ttf
          weight: 300
        - asset: fonts/Lexend-Regular.ttf
        - asset: fonts/Lexend-Medium.ttf
          weight: 500
        - asset: fonts/Lexend-SemiBold.ttf
          weight: 600
    # Skeuomorphism's faces: Geist for text, and Doto's dot matrix for figures
    # at 16px and up — below that the dots stop resolving. Doto is cut to ASCII.
    # OFL; fonts/OFL-Geist.txt and fonts/OFL-Doto.txt.
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist-Bold.ttf
          weight: 700
    - family: Doto
      fonts:
        - asset: fonts/Doto-ExtraBold.ttf
          weight: 800
    # Material 3 Expressive's face, pinned at opsz 18, width 100, and no slant,
    # grade or rounding. OFL; fonts/OFL-GoogleSansFlex.txt. "Google Sans" is a
    # Google trademark: the family name here is an asset id, never shown.
    - family: GoogleSansFlex
      fonts:
        - asset: fonts/GoogleSansFlex-Regular.ttf
        - asset: fonts/GoogleSansFlex-Medium.ttf
          weight: 500
        - asset: fonts/GoogleSansFlex-SemiBold.ttf
          weight: 600
        - asset: fonts/GoogleSansFlex-Bold.ttf
          weight: 700
        - asset: fonts/GoogleSansFlex-ExtraBold.ttf
          weight: 800
