[workspace]
resolver = "2"
# Bare `cargo build`/`run`/`test` target only the app (which links core/photos/
# videos/platform). The other crates stay in the workspace — build them
# explicitly with `-p tulipix-<name>` when wiring a section. Keeps the dev loop
# from compiling all 15 crates' source on a bare build.
default-members = ["crates/tulipix-app"]
members = [
    "crates/tulipix-app",
    "crates/tulipix-ui",
    "crates/tulipix-common",
    "crates/tulipix-core",
    "crates/tulipix-photos",
    "crates/tulipix-videos",
    "crates/tulipix-music",
    "crates/tulipix-books",
    "crates/tulipix-cloud",
    "crates/tulipix-player",
    "crates/tulipix-ai",
    "crates/tulipix-whisper",
    "crates/tulipix-platform",
    "crates/tulipix-plugins",
    "crates/tulipix-tools",
    "crates/tulipix-sec-tools",
    "crates/tulipix-cli",
    "tools/fetch-resources",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/atishsharma/tulipix"

[workspace.dependencies]
# Renderer features are NOT set here — tulipix-app selects them via its own
# `renderer-skia` / `renderer-femtovg` features so a size-lean femtovg build is
# possible. Default (embedded-mpv) still pulls skia-opengl. See app Cargo.toml.
slint = { version = "1.8", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-fontique-08", "raw-window-handle-06"] }
slint-build = "1.8"
# Trimmed from "full": no crate uses tokio::net / signal / io-std (reqwest and
# sqlx enable their own net stack). Member crates may add features on top.
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
keyring = "3"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
wasmtime = { version = "26", default-features = false, features = ["runtime", "cranelift"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "serialize"] }

# NOTE: the Cranelift debug-codegen backend is a Linux-only / nightly-only
# speed knob and is NOT set here — it would make `cargo build` fail on stable
# and on Windows/macOS. The Linux fast path injects it at the CLI via
# `just run` / `just run-dev` (cargo +nightly --config profile.dev.codegen-backend=...).
[profile.dev]
opt-level = 0                 # our crates: fastest codegen for quick edits
debug = "line-tables-only"    # keep backtraces+line numbers, drop heavy debuginfo
split-debuginfo = "unpacked"  # faster linking on Linux
incremental = true

# Dependencies rarely rebuild — keep them optimized so the app runs smooth and
# strip debuginfo so each relink of tulipix-app stays small. sccache (Linux
# fast path) caches these across fresh builds.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = "s"               # optimize for size; smaller binary = faster cold start
lto = "fat"                   # whole-program LTO: smaller + faster (slower link, packaging-only)
codegen-units = 1
strip = "symbols"
panic = "abort"

# Upstream i-slint-compiler 1.16.1 requests image with the "default" feature,
# which drags the AVIF encoder (rav1e — one of the slowest crates on crates.io),
# exr, and ~20 other crates into every fresh build. Our .slint files only embed
# SVG (handled by resvg) and png/jpeg, so the vendored copy trims image to
# png+jpeg only. Re-vendor when bumping Slint past 1.16.1.
[patch.crates-io]
i-slint-compiler = { path = "vendor/i-slint-compiler" }
