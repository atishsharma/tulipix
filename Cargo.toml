[workspace]
resolver = "2"
# The Rust libraries under the Flutter app. The app's own bridge crate,
# crates/tulipix-bridge, is a separate workspace that path-depends on these.
members = [
    "crates/tulipix-common",
    "crates/tulipix-core",
    "crates/tulipix-photos",
    "crates/tulipix-videos",
    "crates/tulipix-music",
    "crates/tulipix-mdl",
    "crates/tulipix-cloud",
    "crates/tulipix-ai",
    "crates/tulipix-whisper",
    "crates/tulipix-platform",
    "crates/tulipix-tools",
    "crates/tulipix-transfer",
    "crates/tulipix-books",
    "crates/tulipix-genesis",
    "crates/tulipix-finances",
    "crates/tulipix-status",
    "crates/tulipix-cli",
    "tools/fetch-resources",
]
# tulipix-plugins is NOT a member. Nothing in the workspace depends on it — the
# WASM/Lua sandboxes were never wired to a call site — but membership still put
# `wasmtime` (+ the wit-* / wasm-encoder tree) and a vendored `mlua` into the
# lockfile, and `just clippy`, which runs --workspace --all-targets, compiled
# all of it. That is a C++ toolchain's worth of build on a box that has to cap
# its own parallelism.
#
# The crate and its tests are untouched on disk. Build it directly when the
# sandboxes get wired: `cargo build --manifest-path crates/tulipix-plugins/Cargo.toml`.
# Then move this line back up into `members`.
exclude = ["crates/tulipix-plugins"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/atishsharma/tulipix"

[workspace.dependencies]
# Trimmed from "full": no crate uses tokio::net / signal / io-std (reqwest and
# sqlx enable their own net stack). Member crates may add features on top.
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
keyring = "4"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "query"] }
wasmtime = { version = "26", default-features = false, features = ["runtime", "cranelift"] }
# Transfer section. axum's default features drag in `form`, `multipart`
# (→ multer) and the tracing hooks; uploads are raw-body PUTs, so none of that
# is used. Everything under axum — hyper 1.x, http, http-body, tower, bytes,
# tokio-util, futures-util — is already in the lockfile via reqwest, so the
# real marginal cost is axum + axum-core + matchit + mime.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
fast_qr = { version = "0.14", default-features = false }
if-addrs = "0.15"
# Already in the tree under reqwest; named directly so the transfer crate can
# stream a request body and a file without pulling a second async-stream stack.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Already in the tree under rustls. Used for the PIN, pairing keys and tokens —
# no separate RNG crate.
getrandom = "0.4"
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "serialize"] }

[profile.dev]
opt-level = 0                 # our crates: fastest codegen for quick edits
debug = "line-tables-only"    # keep backtraces+line numbers, drop heavy debuginfo
split-debuginfo = "unpacked"  # faster linking on Linux
incremental = true

# Dependencies rarely rebuild — keep them optimized and strip their debuginfo.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = "s"               # optimize for size; smaller binary = faster cold start
lto = "fat"                   # whole-program LTO: smaller + faster (slower link, packaging-only)
codegen-units = 1
strip = "symbols"
panic = "abort"
