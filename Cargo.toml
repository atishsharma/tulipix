[workspace]
resolver = "2"
# Bare `cargo build`/`run`/`test` target only the app (which links core/photos/
# videos/platform). The other crates stay in the workspace — build them
# explicitly with `-p tulipix-<name>` when wiring a section. Keeps the dev loop
# from compiling all 15 crates' source on a bare build.
default-members = ["crates/tulipix-app"]
members = [
    "crates/tulipix-app",
    "crates/tulipix-ui",
    "crates/tulipix-common",
    "crates/tulipix-core",
    "crates/tulipix-photos",
    "crates/tulipix-videos",
    "crates/tulipix-music",
    "crates/tulipix-mdl",
    "crates/tulipix-cloud",
    "crates/tulipix-ai",
    "crates/tulipix-whisper",
    "crates/tulipix-platform",
    "crates/tulipix-tools",
    "crates/tulipix-transfer",
    "crates/tulipix-sec-tools",
    "crates/tulipix-sec-transfer",
    "crates/tulipix-sec-photos",
    "crates/tulipix-sec-music",
    "crates/tulipix-sec-videos",
    "crates/tulipix-sec-cloud",
    "crates/tulipix-sec-books",
    "crates/tulipix-books",
    "crates/tulipix-genesis",
    "crates/tulipix-sec-genesis",
    "crates/tulipix-finances",
    "crates/tulipix-sec-finances",
    "crates/tulipix-status",
    "crates/tulipix-sec-status",
    "crates/tulipix-hot",
    "crates/tulipix-cli",
    "tools/fetch-resources",
]
# tulipix-plugins is NOT a member. Nothing in the workspace depends on it — the
# WASM/Lua sandboxes were never wired to a call site — but membership still put
# `wasmtime` (+ the wit-* / wasm-encoder tree) and a vendored `mlua` into the
# lockfile, and `just clippy`, which runs --workspace --all-targets, compiled
# all of it. That is a C++ toolchain's worth of build on a box that has to cap
# its own parallelism.
#
# The crate and its tests are untouched on disk. Build it directly when the
# sandboxes get wired: `cargo build --manifest-path crates/tulipix-plugins/Cargo.toml`.
# Then move this line back up into `members`.
exclude = ["crates/tulipix-plugins"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/atishsharma/tulipix"

[workspace.dependencies]
# Renderer features are NOT set here — tulipix-app selects them via its own
# `renderer-skia` / `renderer-femtovg` features so a size-lean femtovg build is
# possible. Either one now builds everything: nothing is coupled to a renderer
# since the embedded player was dropped for out-of-process mpv. See app
# Cargo.toml.
# unstable-winit-030: `slint::winit_030::WinitWindowAccessor`, the only way to
# reach `drag_window()`. The caption row we draw ourselves has to hand its move
# drag to the compositor — Wayland gives a toplevel no way to position itself —
# and Slint exposes no drag API of its own.
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-fontique-010", "raw-window-handle-06", "unstable-winit-030"] }
slint-build = "1.17"
# Trimmed from "full": no crate uses tokio::net / signal / io-std (reqwest and
# sqlx enable their own net stack). Member crates may add features on top.
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
keyring = "3"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
wasmtime = { version = "26", default-features = false, features = ["runtime", "cranelift"] }
# Transfer section. axum's default features drag in `form`, `multipart`
# (→ multer) and the tracing hooks; uploads are raw-body PUTs, so none of that
# is used. Everything under axum — hyper 1.x, http, http-body, tower, bytes,
# tokio-util, futures-util — is already in the lockfile via reqwest, so the
# real marginal cost is axum + axum-core + matchit + mime.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
fast_qr = { version = "0.14", default-features = false }
if-addrs = "0.15"
# Already in the tree under reqwest; named directly so the transfer crate can
# stream a request body and a file without pulling a second async-stream stack.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Already in the tree under rustls. Used for the PIN, pairing keys and tokens —
# no separate RNG crate.
getrandom = "0.4"
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "serialize"] }

# NOTE: the Cranelift debug-codegen backend is a Linux-only / nightly-only
# speed knob and is NOT set here — it would make `cargo build` fail on stable
# and on Windows/macOS. The Linux fast path injects it at the CLI via
# `just run` / `just run-dev` (cargo +nightly --config profile.dev.codegen-backend=...).
[profile.dev]
opt-level = 0                 # our crates: fastest codegen for quick edits
debug = "line-tables-only"    # keep backtraces+line numbers, drop heavy debuginfo
split-debuginfo = "unpacked"  # faster linking on Linux
incremental = true

# Dependencies rarely rebuild — keep them optimized so the app runs smooth and
# strip debuginfo so each relink of tulipix-app stays small. sccache (Linux
# fast path) caches these across fresh builds.
[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = "s"               # optimize for size; smaller binary = faster cold start
lto = "fat"                   # whole-program LTO: smaller + faster (slower link, packaging-only)
codegen-units = 1
strip = "symbols"
panic = "abort"

# Upstream i-slint-compiler 1.17.1 requests image with the "default" feature,
# which drags the AVIF encoder (rav1e — one of the slowest crates on crates.io),
# exr, and ~20 other crates into every fresh build. Our .slint files only embed
# SVG (handled by resvg) and png/jpeg, so the vendored copy trims image to
# png+jpeg only. Re-vendor when bumping Slint past 1.17.1: slint pins the
# compiler with "=<its own version>", so a stale vendor silently stops being
# used (cargo warns "patch not used") and rav1e comes back.
[patch.crates-io]
i-slint-compiler = { path = "vendor/i-slint-compiler" }
