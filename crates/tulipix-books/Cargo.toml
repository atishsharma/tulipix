[package]
name = "tulipix-books"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Books engine — no UI. Scans EPUB / PDF / CBZ / CBR / MOBI / AZW3 into a
# standalone books.db, extracts metadata + covers, parses EPUB into reflowable
# text, paginates it, parses TOC, renders PDF/comic pages (pdftoppm / zip /
# unrar), and owns reading progress + bookmarks + annotations + library queries.

[features]
# Read-aloud neural TTS (Kokoro-82M via ONNX Runtime). Heavy: pulls `ort` +
# onnxruntime binaries — OFF in the lite dev build, ON in release/CI. Runtime
# still degrades to the timer-paced highlight when the model / espeak-ng /
# voices aren't present, so nothing breaks without them.
kokoro = ["dep:ort"]

[dependencies]
anyhow.workspace = true
tokio = { workspace = true }
sqlx.workspace = true
tulipix-core = { path = "../tulipix-core" }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
mobi = "0.8"
sha2 = "0.10"
# Placeholder-cover text raster (already in the tree via Slint's femtovg).
ab_glyph = "0.2"
walkdir = "2"
lopdf = { version = "0.44", default-features = false }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
urlencoding = "2"
# Kokoro TTS (feature `kokoro`) — same ORT pin as tulipix-photos.
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "download-binaries"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
