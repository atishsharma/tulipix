[package]
name = "tulipix-sec-videos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Videos-section LIBRARY wiring extracted from tulipix-app: the grid/show models,
# season/episode parsing, TMDB poster scraping, Discover, and the per-tab row
# queries. The embedded mpv player (mpv.rs + player_* callbacks) stays in main
# by design (its window/texture integration is app-level). main reaches these
# via `use tulipix_sec_videos::*` from the video `window.on_*` callbacks.

[features]
dev-reload = ["tulipix-ui/dev-reload"]

[dependencies]
slint.workspace = true
tokio.workspace = true
tracing.workspace = true
sqlx = { workspace = true }
sha2 = "0.10"
# Stream tab: poster caching for remote search results.
reqwest = { workspace = true }
# Stream tab: "Copy link". Slint exposes no clipboard API; arboard is what the
# upstream TUI uses and is the only cross-platform option here.
# default features drag in the `image` crate for image-data support, which we
# never use; the wayland backend is needed though, or copy silently no-ops.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
tulipix-ui = { path = "../tulipix-ui" }
tulipix-common = { path = "../tulipix-common" }
tulipix-core = { path = "../tulipix-core" }
tulipix-videos = { path = "../tulipix-videos" }
# Stream tab: casting. `tulipix_music::cast` is protocol-only (SSDP datagrams +
# DLNA SOAP bodies, no audio in it), and a Stream URL is plain HTTP, so the
# renderer can fetch it directly — no local media server as the music path needs.
tulipix-music = { path = "../tulipix-music" }
