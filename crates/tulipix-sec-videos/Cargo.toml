[package]
name = "tulipix-sec-videos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Videos-section LIBRARY wiring extracted from tulipix-app: the grid/show models,
# season/episode parsing, TMDB poster scraping, Discover, and the per-tab row
# queries. The embedded mpv player (mpv.rs + player_* callbacks) stays in main
# by design (its window/texture integration is app-level). main reaches these
# via `use tulipix_sec_videos::*` from the video `window.on_*` callbacks.

[features]
dev-reload = ["tulipix-ui/dev-reload"]

[dependencies]
slint.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
sqlx = { workspace = true }
sha2 = "0.10"
tulipix-ui = { path = "../tulipix-ui" }
tulipix-common = { path = "../tulipix-common" }
tulipix-core = { path = "../tulipix-core" }
tulipix-videos = { path = "../tulipix-videos" }
