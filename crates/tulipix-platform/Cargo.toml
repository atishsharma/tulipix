[package]
name = "tulipix-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Tray + global accelerator requires libxdo on Linux; default off to keep
# headless CI green. Packaging targets enable it explicitly.
tray = ["dep:tray-icon"]

[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring.workspace = true
tray-icon = { version = "0.19", optional = true }
tulipix-core = { path = "../tulipix-core" }

# muda's Linux backend needs a GTK window to attach to; Slint's winit backend
# has none, so the Linux menubar path can never work — keeping muda out of the
# Linux build drops the whole GTK3/glib/cairo/pango stack (~45 crates).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda = { version = "0.15", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSView", "NSVisualEffectView"] }
