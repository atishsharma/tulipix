[package]
name = "tulipix-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Tray + global accelerator requires libxdo on Linux; default off to keep
# headless CI green. Packaging targets enable it explicitly.
tray = ["dep:tray-icon", "dep:gtk"]

[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring.workspace = true
# Used by share.rs (caps gate) on every platform — must not be Linux-only.
tulipix-core = { path = "../tulipix-core" }
# default-features off drops the libxdo (xdotool) link dep — absent on this
# box and unneeded on Wayland; only bare-X11 menu positioning degrades.
tray-icon = { version = "0.19", optional = true, default-features = false }

# The tray's Linux backend is GTK; the dedicated tray thread calls gtk::init
# + gtk::main itself (Slint owns the real main thread).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

# muda's Linux backend needs a GTK window to attach to; Slint's winit backend
# has none, so the Linux menubar path can never work — keeping muda out of the
# Linux build drops the whole GTK3/glib/cairo/pango stack (~45 crates).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda = { version = "0.15", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Raw `objc2::msg_send` only — the typed AppKit/Foundation wrappers were
# declared but never named, so objc2-foundation and objc2-app-kit are gone.
objc2 = "0.5"
