[package]
name = "tulipix-videos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
sqlx.workspace = true
reqwest = { workspace = true, features = ["json"] }
sha2.workspace = true
async-trait = "0.1"
# Stream backend (src/stream) — request signing is HMAC-MD5 over a canonical
# string, so md-5/hmac ride on the digest 0.10 already pulled in by sha2, and
# url/base64 are both already in the tree via reqwest.
thiserror.workspace = true
hmac = "0.12"
md-5 = "0.10"
base64 = "0.22"
url = "2"
tulipix-core = { path = "../tulipix-core" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
