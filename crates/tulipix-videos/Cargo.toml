[package]
name = "tulipix-videos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
sqlx.workspace = true
reqwest = { workspace = true, features = ["json"] }
sha2.workspace = true
async-trait = "0.1"
# Stream backend (src/stream) — request signing is HMAC-MD5 over a canonical
# string, so md-5/hmac ride on the digest 0.10 already pulled in by sha2, and
# url/base64 are both already in the tree via reqwest.
thiserror.workspace = true
# Live TV and the 4KHDHub scraper both log what they skipped rather than
# failing a whole batch, so they need the tracing macros.
tracing.workspace = true
hmac = "0.13"
md-5 = "0.11"
base64 = "0.23"
url = "2"
# AniDB: both its endpoints answer with a gzip body and no Content-Encoding
# header, and the anime document is XML. Both crates are already in the tree
# (flate2 under lofty and zip, roxmltree under usvg), so this is two
# dependency lines rather than two new crates to compile.
flate2 = "1"
roxmltree = "0.21"
# Addic7ed has no API: its episode page is read with a handful of regexes.
# regex is already in the tree under tracing-subscriber's env-filter.
regex = "1"
# Stream Plus streams a download to disk chunk by chunk rather than buffering a
# whole episode in memory, which needs reqwest's byte stream.
futures-util = { workspace = true }
tulipix-core = { path = "../tulipix-core" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
