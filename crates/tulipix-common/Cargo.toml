[package]
name = "tulipix-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Shared app infrastructure: the per-section SQLite pool cache (`pool_for`),
# the data-dir helpers, and the bundled-binary probes.

[dependencies]
anyhow.workspace = true
sqlx = { workspace = true }
tracing.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# OS now-playing surface (MPRIS/SMTC) — media_set_playing mirrors play state.
souvlaki = "0.8"
tulipix-core = { path = "../tulipix-core" }
tulipix-photos = { path = "../tulipix-photos" }
tulipix-videos = { path = "../tulipix-videos" }
tulipix-music = { path = "../tulipix-music" }
tulipix-cloud = { path = "../tulipix-cloud" }
tulipix-tools = { path = "../tulipix-tools" }
tulipix-books = { path = "../tulipix-books" }

# PR_SET_PDEATHSIG in mpv_die_with_parent (playback core) — Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

