[package]
name = "tulipix-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Shared app infrastructure used by every section-wiring crate: the per-section
# SQLite pool cache (`pool_for`), the data-dir helpers, and the bundled-binary
# probes. Lives in its own crate so section crates don't depend on tulipix-app.

[dependencies]
anyhow.workspace = true
sqlx = { workspace = true }
tracing.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Optional, behind `histogram`: the two helpers at the bottom of lib.rs are the
# only slint in this crate, and they are the only reason the Flutter bridge --
# which links this crate for pool_for and the quote shelf -- was dragging 289
# crates of slint, winit and the software renderer into a cdylib that can never
# start an event loop. The three Slint-only crates that call them turn it on.
slint = { workspace = true, optional = true }
# Cross-section image helpers (histogram render). png/jpeg/webp match the app.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"], optional = true }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
# OS now-playing surface (MPRIS/SMTC) — media_set_playing mirrors play state.
souvlaki = "0.7"
tulipix-core = { path = "../tulipix-core" }
tulipix-photos = { path = "../tulipix-photos" }
tulipix-videos = { path = "../tulipix-videos" }
tulipix-music = { path = "../tulipix-music" }
tulipix-cloud = { path = "../tulipix-cloud" }
tulipix-tools = { path = "../tulipix-tools" }
tulipix-books = { path = "../tulipix-books" }

# PR_SET_PDEATHSIG in mpv_die_with_parent (playback core) — Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Off by default, on for the three Slint-only crates that draw a histogram.
# Keeping it off is what keeps slint out of the Flutter bridge's build.
[features]
histogram = ["dep:slint", "dep:image"]
