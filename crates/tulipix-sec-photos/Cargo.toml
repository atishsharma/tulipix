[package]
name = "tulipix-sec-photos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Photos-section wiring: grid/timeline/library population, category filter,
# selection + clipboard, dedupe/map cards, the non-destructive editor, and the
# viewer's exif/histogram panel. tulipix-app reaches these via `use
# tulipix_sec_photos::*` from its photo `window.on_*` callbacks.

[features]
# Forward live-reload to the UI crate (slint/live-preview swaps UI types).
dev-reload = ["tulipix-ui/dev-reload"]
# Real ONNX editor ops (upscale/colorize). Pulls ORT into tulipix-photos.
ai-onnx = ["tulipix-photos/onnx"]

[dependencies]
slint.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
sqlx = { workspace = true }
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tulipix-ui = { path = "../tulipix-ui" }
tulipix-common = { path = "../tulipix-common" }
tulipix-core = { path = "../tulipix-core" }
tulipix-photos = { path = "../tulipix-photos" }
