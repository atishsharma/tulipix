[package]
name = "tulipix-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The generated Slint UI (MainWindow + all exported structs) lives here so it
# compiles as its own rustc unit — keeping the tulipix-app binary crate (and any
# section-wiring crate) small enough to type-check without exhausting memory.

[features]
# Mirror tulipix-app's dev-reload: `slint/live-preview` changes what the Slint
# compiler emits (interpreter-backed LiveReloadingComponent), so the codegen
# here must enable it too. Build with SLINT_LIVE_PREVIEW=1.
dev-reload = ["slint/live-preview"]

[dependencies]
slint.workspace = true

# No renderer here on purpose: tulipix-app picks one (skia for the embedded
# player, femtovg for the lite build) and it unifies down into this crate. But
# `cargo test -p tulipix-ui` on its own has no app above it, so the winit
# backend sees zero renderers and stops with a compile_error!. A dev-dependency
# names one for the test build only — it never reaches a release binary, which
# keeps the renderer choice where it belongs.
[dev-dependencies]
slint = { workspace = true, features = ["renderer-femtovg"] }

[build-dependencies]
slint-build.workspace = true
