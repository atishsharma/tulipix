[package]
name = "tulipix-sec-books"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Books-section wiring: the Book Home page (Continue Reading hero, stats strip,
# Recently Added / library grid, filter chips) plus the reader. tulipix-app
# calls `wire(&window)` once at startup.

[features]
# Forward live-reload to the UI crate so a dev-reload app build keeps the
# generated UI types in sync (slint/live-preview swaps them out).
dev-reload = ["tulipix-ui/dev-reload"]
# Dev-only: lets `cargo check -p tulipix-sec-books` satisfy slint's winit
# backend renderer requirement in isolation (the app normally selects it).
_check = ["slint/renderer-skia", "slint/renderer-skia-opengl"]
# Neural read-aloud (Kokoro-82M). Heavy (ONNX Runtime) — off in lite dev, on in
# release/CI. Runtime falls back to timer highlight without the model/espeak.
kokoro = ["tulipix-books/kokoro"]

[dependencies]
slint.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tulipix-ui = { path = "../tulipix-ui" }
tulipix-common = { path = "../tulipix-common" }
tulipix-core = { path = "../tulipix-core" }
tulipix-books = { path = "../tulipix-books" }
