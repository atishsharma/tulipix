# Cargo features for the Flutter build.
#
# cargokit builds this crate itself, from the CMake/Gradle glue rather than from
# the justfile, so `--features` cannot be passed on a command line. It does read
# this file out of the crate directory (`CargokitCrateOptions.load`, keyed on
# CARGOKIT_MANIFEST_DIR, which linux/CMakeLists.txt points at
# ../../../crates/tulipix-bridge) and splices `extra_flags` into the cargo
# invocation. No patch to the vendored build tool needed.
#
# `books-tts` is the reader's neural read-aloud voice (Kokoro-82M through ORT).
# It pulls `ort` and the onnxruntime binaries, which is a slow first build on a
# 4-thread box -- so debug stays without it and `just dev` stays quick. Without
# the feature the reader still speaks: `kokoro::available()` is false and
# `tts_engine` steps down to espeak on its own.
#
# `ai-onnx` is the real ONNX inference -- the photo editor's ops, and the
# object, face and CLIP passes behind Photos > AI. It had been unreachable from
# a Flutter build, so `make_tagger` and `make_face_models` compiled as the stubs
# that answer None: the AI tab said "inference: not in this build", models
# downloaded perfectly and every Run marked nothing and finished instantly. The
# Slint build has always had it (`run-dev-lite` in the root justfile).
#
# Debug is deliberately still without either, as it was: `stage_ready` answers
# false for the model passes when the feature is absent, so `just dev` says so
# rather than offering a Run that cannot work.
cargo:
  profile:
    extra_flags: ["--features", "books-tts,ai-onnx"]
  release:
    extra_flags: ["--features", "books-tts,ai-onnx"]
