[package]
# Underscored, unlike every other crate here. Cargokit builds the artifact
# filename straight from `package.name` and never underscores it, so a
# `tulipix-bridge` package makes it look for `libtulipix-bridge.so` while cargo
# emits `libtulipix_bridge.so`, and the CMake install step fails with a missing
# file. The directory keeps the hyphen; only the package name changes.
name = "tulipix_bridge"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

# The only Rust the Flutter port adds. Its own `[workspace]` table (below) makes
# it a self-contained workspace, so adding this crate needed no edit to the root
# manifest — the frozen-tree rule in docs/flutter-port-plan.html §02.
#
# The cost is a second Cargo.lock and a second target/, so the domain crates it
# depends on compile twice. That is fine while the bridge touches two of them.
# From phase 3, when it touches all of them, trade the purity for the shared
# build cache: add one line to the root `members` list and add `Cargo.toml` to
# the CI allowlist in .github/workflows/flutter.yml.
#
# Precedent in reverse: crates/tulipix-plugins is deliberately `exclude`d from
# the root workspace for the same build-cost reason.
#
# The second lock is the part that needs tending. It resolves independently, so
# it drifts from the root's — it had reached 148 crates apart, with this one the
# older of the two, which meant the frozen domain crates were compiling here
# against versions nothing else had proven. Re-run `cargo update` in this
# directory whenever the root lock moves; the versions the root ships are the
# ones tulipix-photos is known to build with.
[workspace]

[lib]
# cdylib for Linux/Windows, staticlib for macOS/iOS, rlib for `cargo test`.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Must match BOTH the codegen CLI and the `flutter_rust_bridge` pin in
# app_flutter/pubspec.yaml. frb checks all three and refuses on a mismatch.
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
# `process` is Music's: mpv, ffprobe, ffmpeg and yt-dlp are all out-of-process,
# and the ones that are awaited (yt-dlp listings, downloads) must not block a
# bridge worker for the minutes they can take.
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "time"] }
# File and folder dialogs (api/dialog.rs), configured exactly as the Slint
# build's: the portal backend, so KDE shows its own picker.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `cast_serve` needs an unguessable path segment for the file it publishes to
# the network. Already in the tree under rustls; used rather than adding a
# second RNG, and the same call tulipix-transfer makes.
#
# Pinned rather than inherited: this crate is its own workspace -- see the note
# at the top of the file -- so there is no `workspace.dependencies` to take it
# from. Version tracks the root workspace's.
getrandom = "0.4"
tracing = "0.1"
# The Slint binary installs this in main(); a cdylib has no main, so without it
# every `tracing::warn!` the domain crates emit -- "inbox unwritable", "upload
# could not be finalised", "no certificate, serving plain HTTP" -- is discarded,
# and a bug that names itself out loud looks like silence.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The viewer's info panel. Feature lists match tulipix-photos exactly: cargo
# unifies features across a dependency graph, so asking for a wider set here
# would pull the AVIF/EXR encoders into a build that already compiles `image`.
# `ico` is the one addition: a decoder only, for radio station favicons.
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
# The generated radio station tile (`name_tile`): letters rasterised from the
# bundled Sora.
ab_glyph = "0.2"

# Transfer. The QR is a module matrix, not an image: Dart paints the squares,
# which is a twentieth of the bytes and stays crisp when the code is enlarged.
# default-features off: the image converters go through resvg + tiny-skia to
# rasterise an SVG.
fast_qr = { version = "0.14", default-features = false }

# Videos. Poster and channel-logo caches are keyed by a hash of the remote URL,
# the same formula tulipix-videos uses for its own TMDB cache -- so both builds
# hit the same files rather than downloading the artwork twice.
sha2 = "0.11"
# Papers' vault: files and their text sealed at rest. Already in the lockfile
# (age pulls it in); `getrandom` above makes the nonces, so no RNG feature.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# ACME (RFC 8555), for the transfer server's optional real certificate.
#
# `default-features = false` matters more than usual here: the default is
# aws-lc-rs, and tulipix-transfer's tls.rs builds its rustls config with a
# *named* ring provider precisely because a second provider in one process makes
# `ServerConfig::builder()` panic on a process-wide default that is now
# ambiguous. `ring` keeps one provider in the tree. `rcgen` is what makes
# `Order::finalize` generate the key itself, and it resolves to the same
# rcgen 0.14 tulipix-transfer already uses.
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }

# Two dependencies left this file on 2026-08-24 and are named here so nobody
# adds them back by reflex.
#
# `libc` was `PR_SET_PDEATHSIG` on the windowed mpv, which existed because a
# crashed app could leave a video playing in a window nothing owns. There is no
# such window any more — media_kit draws into this one.
#
# `rfd` (xdg-portal) opened three file choosers. Dart's `file_selector` opens
# every chooser in the app now, including the eleven places that used to be a
# text field you typed an absolute path into, so the dialogs are all in one
# place and it is not this one.

# Music. Four of its five tabs talk to the network — RSS feeds, radio-browser,
# LRCLIB, artwork — and the domain crate hands back parsed types rather than
# bytes, so the client is named here too. Same version and same TLS backend as
# the root workspace: a second rustls in one process is a second root store.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }

# Domain crates, by relative path.
#
# `tulipix-common`: `pool_for` -- which tulipix-status needs too -- and
# `quotes::shuffled`, the Home page's quote shelf.
tulipix-common = { path = "../tulipix-common" }
tulipix-core = { path = "../tulipix-core" }
tulipix-photos = { path = "../tulipix-photos" }
tulipix-transfer = { path = "../tulipix-transfer" }
# Music: scan, tags, browse, playlists, queue, ratings, lyrics, podcasts,
# audiobooks, radio and the YouTube store. No slint, so it is allowed.
tulipix-music = { path = "../tulipix-music" }
tulipix-books = { path = "../tulipix-books" }
# The Downloader: provider scrapers (URL -> tracklist) and the per-track
# search/download/tag pipeline over the bundled yt-dlp. No slint; the crate was
# written against reqwest and lofty only.
tulipix-mdl = { path = "../tulipix-mdl" }
tulipix-cloud = { path = "../tulipix-cloud" }
tulipix-tools = { path = "../tulipix-tools" }
# Finances: money arithmetic in i64 minor units, the recurrence engine, budgets,
# loans, dues, insights and statement import. No slint, and no UI types at all —
# the crate was written to be testable with no renderer, which is what makes it
# linkable here.
tulipix-finances = { path = "../tulipix-finances" }
# Videos: the local library, the TMDB scraper, Discover, the two remote
# catalogues, Live TV and Stream Plus. No slint -- the crate was written against
# sqlx and reqwest only, which is what makes it linkable here.
tulipix-videos = { path = "../tulipix-videos" }
# Status: `collect()` -- one JSON snapshot of every section, and the only place
# these figures are derived. The browser dashboard and the Flutter page both
# render this same Value, which is why they cannot disagree about a number.
tulipix-status = { path = "../tulipix-status" }
# Genesis: LibGen search, mirror ranking, record pages, covers and downloads.
# Blocking (ureq) by design; every call from here goes through `spawn_blocking`.
tulipix-genesis = { path = "../tulipix-genesis" }
# `fm::open_default`, `fm::reveal_in_file_manager`, and now the status-bar
# item: the `tray` feature is what pulls ksni in, and the bridge is where the
# tray lives in the Flutter build — there is no Slint event loop to host it.
# Still no slint here, which is what makes this dependency allowed at all.
tulipix-platform = { path = "../tulipix-platform", features = ["tray"] }
# MPRIS on Linux, SMTC on Windows, MPNowPlayingInfoCenter on macOS. Same crate
# and version the Slint build registers with, so the two cannot drift apart in
# what they publish; the publish helpers themselves are tulipix-common's.
souvlaki = "0.8"

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Real ONNX editor ops, forwarded to tulipix-photos.
ai-onnx = ["tulipix-photos/onnx"]

# The reader's neural read-aloud voice (Kokoro-82M through ORT). Heavy -- it
# pulls `ort` and the onnxruntime binaries -- and off by default for the same
# reason it is off in the lite dev build. Without it `books_tts_say` still
# speaks, in espeak's voice: `kokoro::available()` is false when the feature is
# absent, so `tts_engine` degrades on its own rather than failing.
books-tts = ["tulipix-books/kokoro"]

# SQLCipher for the library databases, forwarded to tulipix-core. Off by
# default: it builds SQLCipher from source and links the system OpenSSL, which
# is a real build requirement to put on everyone for a setting most people
# leave off. Without it, Settings › Security says so instead of pretending.
db-encrypt = ["tulipix-core/db-encrypt"]

# Cargo reads profiles from the workspace ROOT manifest, and this crate is its
# own workspace root — so it inherits none of the tuning in the repo's
# Cargo.toml. Without this block the bridge builds its dependency tree with full
# debuginfo at opt-level 0, which on a 4-thread / 8 GB box is the difference
# between a slow build and a swapping one. Mirrors the root profiles; keep the
# two in step.
#
# `.cargo/config.toml` (mold linker) IS picked up, because cargo discovers
# config by walking up from the working directory rather than from the
# workspace root.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# `#[frb(...)]` expands to code guarded by `cfg(frb_expand)`, a cfg the macro
# crate sets and this crate never does. Declaring it here silences the warning
# on every `frb` attribute without switching the whole lint off.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
