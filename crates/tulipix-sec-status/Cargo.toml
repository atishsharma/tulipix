[package]
name = "tulipix-sec-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Status-section wiring: the same collect() snapshot the browser page draws, as Slint models."

# The native half of the Status dashboard. `tulipix-status` builds the snapshot
# and serves it as HTML over loopback; this crate takes the *identical* JSON and
# turns it into the typed models `page_status.slint` draws. There is no second
# set of queries — that is the whole point of keeping both renderings.

[features]
# Forward live-reload to the UI crate so a dev-reload app build keeps the
# generated UI types in sync (slint/live-preview swaps them out).
dev-reload = ["tulipix-ui/dev-reload"]
# Dev-only: lets `cargo check -p tulipix-sec-status` satisfy slint's winit
# backend renderer requirement in isolation (the app normally selects it).
_check = ["slint/renderer-skia", "slint/renderer-skia-opengl"]

[dependencies]
slint.workspace = true
serde_json.workspace = true
tulipix-ui = { path = "../tulipix-ui" }
# For `collect::clock` only. The snapshot itself arrives as a `serde_json::Value`
# from the app, but the footer's "3:25 PM" has to be the same function the
# browser footer uses — two clocks that can disagree is two clocks.
tulipix-status = { path = "../tulipix-status" }
