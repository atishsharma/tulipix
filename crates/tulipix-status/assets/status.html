<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No external anything: no CDN, no font, no analytics. The app serves this
     file from loopback and it must render identically with the network off.
     The icon is the app's own, served by the same process from /logo.png. -->
<title>Tulipix · Status</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
/* Served by this same process from /title.woff2 — bundled, not a CDN, so the
   page still renders with the network off. SIL OFL 1.1 (assets/FONT-OFL.txt).
   `swap` because the wordmark is decoration: the title must never be the thing
   holding up the first paint. */
@font-face{
  font-family:"Rubik Spray Paint";
  src:url("/title.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --violet:#8b5cf6; --indigo:#6366f1; --pink:#ec4899; --emerald:#10b981;
  --teal:#14b8a6; --cyan:#06b6d4; --orange:#f97316; --lime:#84cc16;
  --slate:#94a3b8; --brand:#7c3aed; --brand2:#4f46e5;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  /* "Working" is not a warning. Amber here made a running scan look like
     something had gone wrong, so busy gets its own green — distinct enough from
     idle to be a different state, and never mistaken for trouble. */
  --busy:#10b981;

  --bg1:#f7f7fc; --bg2:#eef0fa; --bg3:#fbf6f9;
  --card:rgba(255,255,255,.86); --card-solid:#fff;
  --line:rgba(26,16,64,.10); --line-soft:rgba(26,16,64,.06);
  --text:#1a1040; --dim:#6b6a86; --faint:#9a99b3;
  --shadow:0 1px 2px rgba(26,16,64,.05), 0 8px 24px rgba(26,16,64,.06);
}
:root[data-theme="dark"]{
  --bg1:#0e1020; --bg2:#141728; --bg3:#171526;
  --card:rgba(255,255,255,.045); --card-solid:#1a1c2e;
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06);
  --text:#eceaf6; --dim:#a3a1bd; --faint:#6f6d8c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  color:var(--text); min-height:100vh; padding:34px 22px 60px;
  background:
    radial-gradient(900px 500px at 15% -5%, var(--bg3), transparent 60%),
    radial-gradient(900px 600px at 95% 10%, rgba(124,58,237,.07), transparent 55%),
    linear-gradient(170deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto}

.top{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:26px;position:relative}
.mark{width:34px;height:34px;border-radius:9px;display:block;object-fit:contain}
/* The wordmark. Spray Paint is a display face — it carries the title and
   nothing else on the page, and the fallback keeps its own tighter tracking
   because the sprayed letterforms already run wide. */
.top h1{font-family:"Rubik Spray Paint",ui-sans-serif,system-ui,sans-serif;
  font-size:31px;font-weight:400;letter-spacing:0}
.tools{position:absolute;right:0;top:2px;display:flex;gap:8px;align-items:center}
.live{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--faint);
  border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok);
  animation:beat 2s ease-in-out infinite}
.live.stale i{background:var(--warn);animation:none}
.live.dead i{background:var(--bad);animation:none}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}
.tgl{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);
  border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--dim);font-size:12px;font-weight:600}
.tgl:hover{color:var(--text)}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);overflow:hidden}

/* value that just changed — a one-shot tint, so a number moving is visible
   without the page animating constantly */
@keyframes bump{0%{background:color-mix(in srgb,var(--brand) 22%,transparent)}100%{background:transparent}}
.bump{animation:bump 1.1s ease-out;border-radius:5px}

.hero{padding:22px;margin-bottom:16px}
/* stretch, not center: the button row is pinned to the foot of the left column
   with `margin-top:auto`, which needs the column to actually own the height. */
.hero-in{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:stretch}
.hero-l{display:flex;flex-direction:column;gap:16px}
.hero-head{display:flex;gap:15px;align-items:center}
.bigdot{width:52px;height:52px;border-radius:50%;flex:0 0 52px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--ok),#16a34a);color:#fff;
  box-shadow:0 4px 16px rgba(34,197,94,.35);transition:background .3s,box-shadow .3s}
.bigdot.busy{background:linear-gradient(150deg,var(--busy),#059669);box-shadow:0 4px 16px rgba(16,185,129,.35)}
.bigdot.problem{background:linear-gradient(150deg,var(--bad),#dc2626);box-shadow:0 4px 16px rgba(239,68,68,.35)}
.bigdot.unknown{background:linear-gradient(150deg,var(--slate),#64748b);box-shadow:none}
.hero-head h2{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.hero-head p{color:var(--dim);font-size:13px;margin-top:2px;line-height:1.45}

/* The three header figures. One equal-width button each, stretched across the
   whole foot of the hero — they are the largest numbers on the page and used to
   be the smallest thing in the panel. Each opens the card that owns its number,
   so the row is a way in rather than a caption. */
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  border-top:1px solid var(--line-soft);padding-top:14px;
  /* Takes every pixel the header has left, so the row runs the full left side
     and its floor lands on the same line as Rescan Libraries opposite. */
  flex:1;min-height:76px}
.tri button{display:flex;gap:11px;align-items:center;width:100%;height:100%;
  text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--card-solid);color:var(--text);cursor:pointer;font-family:inherit;
  transition:border-color .14s,transform .14s}
.tri button:hover{border-color:var(--a);transform:translateY(-1px)}
.tri .n{display:block;font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.5px}
.tri .l{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
.ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:0 0 24px}
.tri .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px}

/* A column, because Rescan Libraries now lives at its foot. The button used to
   sit on its own row under both panels, which left the header's left side with
   nothing to reach down to. */
.hero-r{background:var(--card-solid);border:1px solid var(--line-soft);border-radius:13px;
  padding:15px;text-align:center;display:flex;flex-direction:column}
.hero-r .big{font-size:26px;font-weight:700;letter-spacing:-.7px;
  background:linear-gradient(90deg,var(--brand),var(--pink));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero-r .sub{font-size:12px;color:var(--dim);margin-top:1px}
.pill{display:inline-block;margin-top:7px;font-size:11px;font-weight:600;padding:3px 11px;
  border-radius:99px;background:rgba(34,197,94,.13);color:#16a34a}
:root[data-theme="dark"] .pill{background:rgba(34,197,94,.16);color:#4ade80}
.spark{display:block;width:100%;height:52px;margin-top:8px}

.acts{display:flex;gap:9px;margin-top:auto;padding-top:13px}
.acts .btn{flex:1;justify-content:center}
.btn{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--card-solid);color:var(--text);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--brand)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(124,58,237,.3)}

.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.m{padding:13px;position:relative;text-align:left;font-family:inherit;color:var(--text);
  cursor:pointer;transition:border-color .14s,transform .14s}
.m:hover{border-color:var(--a);transform:translateY(-1px)}
/* The affordance has to be visible without being loud — these tiles sit six
   across, and six "?" badges would read as six unanswered questions. */
.m .q{position:absolute;top:11px;right:11px;width:15px;height:15px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;font-weight:700;
  background:var(--line-soft);color:var(--faint)}
.m:hover .q{background:var(--a);color:#fff}
.m::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--a)}
.m .lbl{font-size:11px;font-weight:700;color:var(--dim);margin-bottom:7px;
  letter-spacing:.3px;text-transform:uppercase}
.m .val{font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.m .note{font-size:11px;color:var(--faint);margin-top:3px}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
/* Column, so the rows take the slack and every "View Details" lands on the same
   line across the row. Cards carry different numbers of rows and the buttons
   used to sit wherever their own content ended. */
.s{position:relative;display:flex;flex-direction:column}
.s .rows{flex:1}
.s::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--a)}
.s-h{display:flex;gap:10px;align-items:center;padding:15px 14px 11px}
.s-h .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px}
.s-h .nm{font-size:14px;font-weight:700;letter-spacing:-.2px}
.s-h .st{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 6px}
.dot.busy{background:var(--busy)} .dot.problem{background:var(--bad)} .dot.unknown{background:var(--slate)}
.rows{padding:0 14px 12px}
.r{display:flex;justify-content:space-between;gap:8px;font-size:12px;
  padding:6px 0;border-top:1px solid var(--line-soft)}
.r .k{color:var(--dim);white-space:nowrap}
.r .v{font-weight:600;text-align:right}
/* Watched-folder rows carry several chips where every other row carries one
   value, so only they become a flex track. Scoped rather than applied to
   `.r .v` — that selector holds every figure on every card. */
.r.root .v{display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.g{color:#16a34a} .o{color:#d97706} .rd{color:#dc2626} .mut{color:var(--faint);font-weight:500}
:root[data-theme="dark"] .g{color:#4ade80}
:root[data-theme="dark"] .o{color:#fbbf24}
:root[data-theme="dark"] .rd{color:#f87171}
.more{display:block;margin:2px 14px 13px;text-align:center;font-size:11.5px;font-weight:600;
  padding:7px;border-radius:8px;background:var(--line-soft);color:var(--dim);cursor:pointer;
  border:0;width:calc(100% - 28px);font-family:inherit;flex:0 0 auto}
.more:hover{color:var(--text)}

/* The reason a card is red, on the card and again at the top of its popup.
   Distinct from a value row: this is prose, and it is the only thing on the
   card that tells you what to do next. */
.why{margin:0 14px 10px;padding:8px 10px;border-radius:9px;font-size:11.5px;line-height:1.45;
  background:rgba(239,68,68,.09);color:#b91c1c;border:1px solid rgba(239,68,68,.22)}
:root[data-theme="dark"] .why{background:rgba(239,68,68,.13);color:#fca5a5;
  border-color:rgba(239,68,68,.28)}
.m-b .why{margin:14px 0 0}

.bottom{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
.b-h{display:flex;justify-content:space-between;align-items:center;padding:15px 16px 11px}
.b-h h3{font-size:14.5px;font-weight:700}
.chip{font-size:11px;font-weight:600;padding:4px 11px;border-radius:8px;
  border:1px solid var(--line);color:var(--dim)}
.tl{padding:0 16px 14px}
.ev{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line-soft);align-items:flex-start}
.ev .t{font-size:11px;color:var(--faint);width:58px;flex:0 0 58px;padding-top:1px;
  font-variant-numeric:tabular-nums}
.ev .ti{font-size:12.5px;font-weight:600}
.ev .ds{font-size:11px;color:var(--dim);margin-top:1px;word-break:break-word}
.ev .ic{width:18px;height:18px;flex:0 0 18px;border-radius:5px;margin-top:1px}
.tot{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-top:1px solid var(--line-soft);font-size:12.5px}
.tot .lft{display:flex;gap:10px;align-items:center;color:var(--dim)}
.tot .rgt{font-weight:700}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(16,10,40,.42);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:24px}
.scrim.on{display:flex;animation:fade .16s ease-out}
:root[data-theme="dark"] .scrim{background:rgba(0,0,0,.62)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal{background:var(--card-solid);border:1px solid var(--line);border-radius:17px;
  width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(16,10,40,.3);overflow:hidden;
  animation:rise .2s cubic-bezier(.2,.8,.3,1);position:relative}
.modal::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--a);z-index:1}
.m-h{display:flex;gap:12px;align-items:center;padding:19px 18px 15px;border-bottom:1px solid var(--line-soft)}
.m-h .ic{width:36px;height:36px;flex:0 0 36px;border-radius:10px}
.m-h h3{font-size:17px;font-weight:700;letter-spacing:-.3px}
.m-h .st{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:2px}
.x{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center;flex:0 0 30px}
.x:hover{color:var(--text);border-color:var(--a)}
.m-b{padding:4px 18px 16px;overflow-y:auto}
.grp{margin-top:15px}
.grp>h4{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--faint);margin-bottom:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.kpi{border:1px solid var(--line-soft);border-radius:11px;padding:10px 11px;background:var(--card)}
.kpi .v{font-size:17px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.kpi .k{font-size:10.5px;color:var(--dim);margin-top:2px}
table{width:100%;border-collapse:collapse;margin-top:7px;font-size:12.5px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--faint);padding:7px 8px;border-bottom:1px solid var(--line)}
th:last-child,td:last-child{text-align:right}
td{padding:8px;border-bottom:1px solid var(--line-soft);word-break:break-word}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--line-soft)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:99px;
  background:rgba(34,197,94,.13);color:#16a34a;white-space:nowrap}
.tag.w{background:rgba(245,158,11,.15);color:#b45309}
.tag.b{background:rgba(239,68,68,.13);color:#dc2626}
.tag.i{background:var(--line-soft);color:var(--faint)}
:root[data-theme="dark"] .tag{background:rgba(34,197,94,.16);color:#4ade80}
:root[data-theme="dark"] .tag.w{background:rgba(245,158,11,.18);color:#fbbf24}
:root[data-theme="dark"] .tag.b{background:rgba(239,68,68,.18);color:#f87171}
/* Which sections a watched folder feeds. Tinted from the same accent each
   section carries on its own card, so the chip and the card agree on colour
   without the popup knowing anything about sections beyond a name. */
.tag.sec{background:color-mix(in srgb,var(--slate) 16%,transparent);color:var(--slate)}
.tag.sec.photos{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
.tag.sec.videos{background:color-mix(in srgb,var(--indigo) 16%,transparent);color:var(--indigo)}
.tag.sec.music{background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.tag.sec.books{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
/* The one folder tags cannot be built from a section: nothing found anything. */
.tag.sec.none{background:var(--line-soft);color:var(--faint)}
.m-f{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;
  border-top:1px solid var(--line-soft);background:var(--card)}
.empty{font-size:12px;color:var(--faint);padding:10px 0}

.fail{max-width:520px;margin:80px auto;text-align:center;padding:26px}
.fail h2{font-size:19px;font-weight:700;margin-bottom:6px}
.fail p{color:var(--dim);font-size:13px}

/* ── library popup ───────────────────────────────────────────────────────── */
.prose{font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:6px}
.prose b{color:var(--text);font-weight:600}
.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  word-break:break-all}
/* One reindex bar per section. Track and fill are separate elements so the fill
   can animate its width without the track resizing under it. */
.prog{margin-top:9px}
.prog .lb{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
.prog .lb span:last-child{color:var(--dim);font-variant-numeric:tabular-nums}
.prog .tk{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .tk i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s ease-out}
.prog.idle .tk i{background:var(--slate)}
/* An indeterminate sweep for a scan that has not counted its files yet — the
   alternative is a bar sitting at 0% while the disk is clearly busy. */
.prog.wait .tk i{width:35%;animation:sweep 1.3s ease-in-out infinite}
@keyframes sweep{0%{margin-left:-35%}100%{margin-left:100%}}

.danger{margin-top:16px;border:1px solid rgba(239,68,68,.28);border-radius:12px;padding:13px 14px;
  background:rgba(239,68,68,.05)}
:root[data-theme="dark"] .danger{background:rgba(239,68,68,.07)}
.danger h4{font-size:12.5px;font-weight:700;color:#dc2626;margin-bottom:4px}
:root[data-theme="dark"] .danger h4{color:#f87171}
.danger p{font-size:11.5px;color:var(--dim);line-height:1.55}
.btn.bad{background:#dc2626;color:#fff;border-color:transparent}
.btn.bad:hover{background:#b91c1c;border-color:transparent}
.btn.ghost{background:transparent}
/* The library popup's footer runs Close · Add Folder · Reindex · Reset. Left
   outlined, the first two read as disabled next to the two filled ones, and
   "Add Folder" — the only thing in the popup that adds anything — was the
   quietest control on it. Filled, in the colour each one means. */
.btn.calm{background:var(--slate);color:#fff;border-color:transparent}
.btn.calm:hover{background:#64748b;border-color:transparent}
.btn.good{background:var(--emerald);color:#fff;border-color:transparent}
.btn.good:hover{background:#0d9488;border-color:transparent}
input[type=text]{width:100%;margin-top:9px;padding:9px 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--card-solid);color:var(--text);
  font-family:inherit;font-size:13px}
input[type=text]:focus{outline:2px solid var(--brand);outline-offset:-1px}

.foot{max-width:1180px;margin:34px auto 0;padding-top:16px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
  font-size:11.5px;color:var(--faint)}
.foot a{color:var(--brand);text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}
:root[data-theme="dark"] .foot a{color:#a78bfa}

@media (max-width:1080px){
  .metrics{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero-in{grid-template-columns:1fr}
  .bottom{grid-template-columns:1fr}
}
@media (max-width:600px){
  .metrics,.grid{grid-template-columns:1fr}
  .tri{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="mark" src="/logo.png" alt="">
    <h1>Tulipix</h1>
    <div class="tools">
      <span class="live" id="live"><i></i><span id="liveTxt">connecting…</span></span>
      <button class="tgl" onclick="toggleTheme()"><span id="tglIcon">🌙</span><span id="tglTxt">Dark</span></button>
    </div>
  </div>
  <div id="root"></div>
</div>

<footer class="foot">
  <span>&copy; <span id="yr">2026</span> Tulipix · All rights reserved.</span>
  <!-- The one outbound link on the page. It is inert with the network off,
       which is the same promise the rest of the document makes. -->
  <a href="https://tulipix.pro" target="_blank" rel="noopener noreferrer">tulipix.pro</a>
</footer>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";

// The token this page was opened with. Every request carries it; without it the
// server refuses before reaching a handler, which is what stops an unrelated
// browser tab from POSTing to the loopback port and driving the app.
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const api = p => p + (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN);

const ACCENTS = ["violet","indigo","pink","emerald","teal","cyan","orange","lime","slate","brand"];
const accent = a => "var(--" + (ACCENTS.includes(a) ? a : "slate") + ")";

const ICONS = {
  music:'<circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V5l12-2v13"/>',
  books:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  photos:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.6-4.6a2 2 0 0 0-2.8 0L3 21"/>',
  videos:'<rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 9h5M2 15h5M17 9h5M17 15h5"/>',
  cloud:'<path d="M17.5 19a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.6-1.6A4 4 0 0 0 6.5 19z"/>',
  finances:'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M17 13h.01"/>',
  transfer:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  tools:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  ai:'<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M8 2h8"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/>',
  system:'<rect x="2" y="4" width="20" height="7" rx="2"/><rect x="2" y="13" width="20" height="7" rx="2"/><path d="M6 7.5h.01M6 16.5h.01"/>',
};
const CHECK = '<path d="M20 6 9 17l-5-5"/>';
const svg = (body, w) => '<svg width="'+(w||16)+'" height="'+(w||16)+'" viewBox="0 0 24 24" fill="none" '+
  'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+body+'</svg>';

// Everything from the server is inserted as text, never as markup.
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

let DATA = null;        // latest snapshot
let lastAt = 0;         // when it arrived (ms)
let failures = 0;
let openCard = null;    // key of the card whose popup is open, so it re-renders live

// ── render ───────────────────────────────────────────────────────────────────

function render(d){
  const hero = d.hero || {};
  const lvl = d.level || "unknown";

  // Each figure opens the card that produced it — "3 failed jobs" is only ever
  // the beginning of a question, and the answer is one popup away.
  const tri = [
    ["34,197,94", hero.sections_online, "Sections Online", "system", CHECK],
    ["99,102,241", hero.jobs_running, "Jobs Running", "tools",
      '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
    ["239,68,68", hero.jobs_failed, "Failed Jobs", "tools",
      '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>'],
  ].map(([rgb, n, label, card, icon]) =>
    '<button data-card="'+card+'" style="--a:rgb('+rgb+')">'+
      '<span class="ic" style="background:rgba('+rgb+',.14);color:rgb('+rgb+')">'+svg(icon,18)+'</span>'+
      '<span><span class="n" data-w="tri-'+esc(label)+'">'+esc(n)+'</span>'+
      '<span class="l">'+esc(label)+'</span></span></button>'
  ).join("");

  const metrics = (d.metrics||[]).map((m,i) =>
    '<button class="card m" data-metric="'+i+'" style="--a:'+accent(m.accent)+'">'+
      '<span class="q">?</span>'+
      '<div class="lbl">'+esc(m.label)+'</div>'+
      '<div class="val" data-w="met-'+esc(m.label)+'">'+esc(m.value)+'</div>'+
      '<div class="note">'+esc(m.note)+'</div>'+
    '</button>').join("");

  const cards = (d.cards||[]).map(c =>
    '<div class="card s" style="--a:'+accent(c.accent)+'">'+
      '<div class="s-h">'+
        '<div class="ic" style="background:color-mix(in srgb,'+accent(c.accent)+' 14%,transparent);'+
          'color:'+accent(c.accent)+'">'+svg(ICONS[c.key]||ICONS.system)+'</div>'+
        '<div><div class="nm">'+esc(c.name)+'</div>'+
        '<div class="st"><span class="dot '+esc(c.level)+'"></span>'+esc(c.status)+'</div></div>'+
      '</div>'+
      '<div class="rows">'+ (c.rows||[]).map(r =>
        '<div class="r"><span class="k">'+esc(r.k)+'</span>'+
        '<span class="v '+esc(r.cls)+'" data-w="'+esc(c.key+"-"+r.k)+'">'+esc(r.v)+'</span></div>').join("") +
      '</div>'+
      // data-w so it takes part in the value diff: appearing or vanishing
      // changes the element count, which is what triggers a full rebuild.
      (c.why ? '<div class="why" data-w="why-'+esc(c.key)+'">'+esc(c.why)+'</div>' : '')+
      '<button class="more" data-card="'+esc(c.key)+'">'+esc(detailLabel(c))+'</button>'+
    '</div>').join("");

  const timeline = (d.timeline||[]).map(e =>
    '<div class="ev"><span class="t">'+esc(e.at)+'</span>'+
      '<span class="ic" style="background:color-mix(in srgb,'+accent(e.accent)+' 16%,transparent);'+
        'color:'+accent(e.accent)+'">'+svg(CHECK,11)+'</span>'+
      '<span><div class="ti">'+esc(e.title)+'</div><div class="ds">'+esc(e.desc)+'</div></span>'+
    '</div>').join("");

  const today = (d.today||[]).map(t =>
    '<div class="tot"><span class="lft">'+
      '<span class="ic" style="background:color-mix(in srgb,'+accent(t.accent)+' 16%,transparent);'+
        'color:'+accent(t.accent)+'">'+svg(CHECK,11)+'</span>'+esc(t.label)+'</span>'+
      '<span class="rgt" data-w="today-'+esc(t.label)+'">'+esc(t.value)+'</span></div>').join("");

  return ''+
  '<div class="card hero"><div class="hero-in"><div class="hero-l">'+
    '<div class="hero-head"><div class="bigdot '+esc(lvl)+'">'+svg(CHECK,27)+'</div>'+
    '<div><h2>'+esc(d.headline)+'</h2><p>'+esc(d.note)+'</p></div></div>'+
    '<div class="tri">'+tri+'</div>'+
  '</div>'+
  '<div class="hero-r"><div class="big" data-w="lib">'+esc(hero.library_bytes)+'</div>'+
    '<div class="sub">'+esc(hero.library_items)+' items indexed</div>'+
    '<div class="pill">+'+esc(hero.library_week)+' this week</div>'+
    sparkline(hero.spark||[])+
    '<div class="acts">'+
      '<button class="btn primary" id="rescan">'+
        svg('<path d="M3 12h4l3 8 4-16 3 8h4"/>',14)+' Rescan Libraries</button>'+
    '</div>'+
  '</div></div></div>'+
  '<div class="metrics">'+metrics+'</div>'+
  '<div class="grid">'+cards+'</div>'+
  '<div class="bottom">'+
    '<div class="card"><div class="b-h"><h3>Activity Timeline</h3><span class="chip">Recent</span></div>'+
      '<div class="tl">'+(timeline || '<div class="empty">Nothing yet.</div>')+'</div></div>'+
    '<div class="card"><div class="b-h"><h3>Today</h3></div>'+
      '<div class="tl">'+(today || '<div class="empty">Nothing yet.</div>')+'</div></div>'+
  '</div>';
}

// Cards whose popup adds a materially longer list carry their own wording from
// the server (Cloud: "View all 5 remotes"). Everything else is generic.
const detailLabel = c => c.more || "View Details";

function sparkline(pts){
  if (!pts.length) return "";
  const w = 260, h = 52, lo = Math.min(...pts), hi = Math.max(...pts);
  const span = hi - lo || 1;
  const xy = pts.map((v,i) => [
    (i / Math.max(1, pts.length - 1)) * w,
    h - 6 - ((v - lo) / span) * (h - 14),
  ]);
  const line = xy.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#7c3aed" stop-opacity=".26"/>'+
    '<stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+line+' L'+w+','+h+' L0,'+h+' Z" fill="url(#sg)"/>'+
    '<path d="'+line+'" fill="none" stroke="#7c3aed" stroke-width="2" '+
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

// ── live update ──────────────────────────────────────────────────────────────

// Re-rendering the whole document every 2s would throw away scroll position and
// kill any text selection. Instead the markup is rebuilt off-screen and only
// the values that actually differ are written back — so a number changing is
// the only thing that moves, and it gets a one-shot tint on the way.
function paint(d){
  const root = document.getElementById("root");
  const first = !root.firstChild;
  if (first) {
    root.innerHTML = render(d);
    wire();
    return;
  }
  const next = document.createElement("div");
  next.innerHTML = render(d);

  const olds = root.querySelectorAll("[data-w]");
  const news = next.querySelectorAll("[data-w]");
  // Structure changed (a section appeared or vanished) — cheaper and safer to
  // rebuild than to reconcile.
  if (olds.length !== news.length) {
    root.innerHTML = next.innerHTML;
    wire();
    return;
  }
  const map = {};
  news.forEach(el => { map[el.getAttribute("data-w")] = el; });
  olds.forEach(el => {
    const fresh = map[el.getAttribute("data-w")];
    if (!fresh) return;
    if (fresh.textContent !== el.textContent) {
      el.textContent = fresh.textContent;
      el.classList.remove("bump");
      void el.offsetWidth;          // restart the animation
      el.classList.add("bump");
    }
    if (fresh.className !== el.className) el.className = fresh.className;
  });

  // Things outside the value map that still have to track: the header, the
  // status dots, and the two lists at the bottom.
  const swap = sel => {
    const a = root.querySelector(sel), b = next.querySelector(sel);
    if (a && b && a.innerHTML !== b.innerHTML) a.innerHTML = b.innerHTML;
  };
  swap(".hero-head h2"); swap(".hero-head p");
  swap(".bottom .card:first-child .tl"); swap(".bottom .card:last-child .tl");
  const dot = root.querySelector(".bigdot"), ndot = next.querySelector(".bigdot");
  if (dot && ndot) dot.className = ndot.className;
  root.querySelectorAll(".s-h .st").forEach((st, i) => {
    const n = next.querySelectorAll(".s-h .st")[i];
    if (n && n.innerHTML !== st.innerHTML) st.innerHTML = n.innerHTML;
  });
  const sp = root.querySelector(".spark"), nsp = next.querySelector(".spark");
  if (sp && nsp && sp.innerHTML !== nsp.innerHTML) sp.replaceWith(nsp);
}

function wire(){
  // Rescan now opens the Library popup rather than firing immediately. A button
  // that silently re-walks every folder gives no way to see what it is about to
  // touch, and no way back out.
  const rescan = document.getElementById("rescan");
  if (rescan) rescan.onclick = () => openModal("__library");
  document.querySelectorAll("[data-card]").forEach(b => {
    b.onclick = () => openModal(b.getAttribute("data-card"));
  });
  document.querySelectorAll("[data-metric]").forEach(b => {
    b.onclick = () => openModal("__metric:" + b.getAttribute("data-metric"));
  });
}

async function post(path, body){
  try {
    const r = await fetch(api(path), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    return r.ok;
  } catch (e) { return false; }
}

async function tick(){
  // Nothing to do for a page in a background tab; the next foreground tick
  // catches up in full.
  if (document.hidden) return;
  try {
    const r = await fetch(api("/api/status"), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    lastAt = Date.now();
    failures = 0;
    if (DATA.focus) comeForward();
    paint(DATA);
    // Not while a reset phrase is half-typed: repainting the popup under the
    // cursor every two seconds is how someone confirms a wipe by accident.
    if (openCard && !(openCard === "__library" && resetArmed)) fillModal(openCard);
  } catch (e) {
    failures++;
    if (failures >= 3 && !DATA) {
      document.getElementById("root").innerHTML =
        '<div class="card fail"><h2>Cannot reach Tulipix</h2>'+
        '<p>The app may have closed. Open Status again from the sidebar.</p></div>';
    }
  }
}

// The "live" chip is the only thing that updates every second — it is what
// makes a 2s poll feel continuous rather than steppy.
function heartbeat(){
  const el = document.getElementById("live"), txt = document.getElementById("liveTxt");
  if (!lastAt) { txt.textContent = "connecting…"; return; }
  const age = Math.round((Date.now() - lastAt) / 1000);
  el.className = "live" + (failures >= 3 ? " dead" : age > 8 ? " stale" : "");
  txt.textContent = failures >= 3 ? "disconnected"
    : age <= 2 ? "live" : "updated " + age + "s ago";
}

// ── modal ────────────────────────────────────────────────────────────────────

function cardByKey(k){ return (DATA && DATA.cards || []).find(c => c.key === k); }

function openModal(key){
  openCard = key;
  fillModal(key);
  document.getElementById("scrim").classList.add("on");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  openCard = null;
  // Closing disarms. A reset that stayed half-confirmed across a close and a
  // reopen would be one stray click from firing.
  resetArmed = false;
  resetTyped = "";
  document.getElementById("scrim").classList.remove("on");
  document.body.style.overflow = "";
}

// The app was asked to show Status while this page was already open, so it
// asked the page to come forward instead of opening a second tab.
//
// `window.focus()` is the honest attempt and browsers are entitled to ignore
// it — a background process raising a window is exactly what popup blocking
// exists to stop. The title ping and the flash are what actually land, and they
// are still there when the tab is looked at a minute later.
function comeForward(){
  try { window.focus(); } catch (e) {}
  document.documentElement.scrollTop = 0;
  const t = document.title;
  document.title = "▶ " + t;
  setTimeout(() => { document.title = t; }, 4000);
  const top = document.querySelector(".top");
  if (top) {
    top.classList.remove("bump");
    void top.offsetWidth;
    top.classList.add("bump");
  }
}

// The three kinds of popup share one shell, one scrim and one live-refresh
// path; only the body differs. Dispatch here rather than three parallel
// open/close/refresh triples.
function fillModal(key){
  if (key === "__library") return fillLibrary();
  if (key.startsWith("__metric:")) return fillMetric(+key.slice(9));
  fillCard(key);
}

function fillCard(key){
  const c = cardByKey(key);
  if (!c) return;
  const det = c.detail || { kpis: [], groups: [] };

  const kpis = (det.kpis||[]).map(k =>
    '<div class="kpi"><div class="v">'+esc(k[0])+'</div><div class="k">'+esc(k[1])+'</div></div>').join("");

  const groups = (det.groups||[]).map(g => {
    if (g.table) {
      if (!g.table.rows.length) {
        return '<div class="grp"><h4>'+esc(g.h)+'</h4><div class="empty">Nothing right now.</div></div>';
      }
      const head = g.table.cols.map(x => '<th>'+esc(x)+'</th>').join("");
      const body = g.table.rows.map(r => '<tr>'+ r.map((cell, i) =>
        (cell && typeof cell === "object" && cell.tag !== undefined)
          ? '<td><span class="tag '+esc(cell.cls)+'">'+esc(cell.tag)+'</span></td>'
          : '<td'+(i === 0 ? ' style="font-weight:600"' : '')+'>'+esc(cell)+'</td>'
        ).join("") +'</tr>').join("");
      return '<div class="grp"><h4>'+esc(g.h)+'</h4><table><thead><tr>'+head+'</tr></thead>'+
             '<tbody>'+body+'</tbody></table></div>';
    }
    if (!(g.rows||[]).length) return "";
    return '<div class="grp"><h4>'+esc(g.h)+'</h4>'+ g.rows.map(r =>
      '<div class="r"><span class="k">'+esc(r.k)+'</span>'+
      '<span class="v '+esc(r.cls)+'">'+esc(r.v)+'</span></div>').join("") +'</div>';
  }).join("");

  // Only sections that exist in the app get the jump button; "AI & Whisper"
  // and "System" are pages on this dashboard, not places to navigate to.
  const NAV = ["photos","videos","music","books","cloud","tools","transfer","finances"];
  const jump = NAV.includes(c.key)
    ? '<button class="btn primary" id="jump">Open '+esc(c.name)+' in Tulipix</button>' : "";

  shell({
    accent: c.accent,
    icon: ICONS[c.key] || ICONS.system,
    title: c.name,
    sub: '<span class="dot '+esc(c.level)+'"></span>'+esc(c.status),
    body: (c.why ? '<div class="why">'+esc(c.why)+'</div>' : '')+
      '<div class="kpis">'+kpis+'</div>'+groups,
    foot: '<button class="btn" id="mclose">Close</button>'+jump,
  });

  const j = document.querySelector("#jump");
  if (j) j.onclick = async () => {
    j.disabled = true;
    await post("/api/open", { section: c.key });
    closeModal();
    j.disabled = false;
  };
}

// The common frame. Every popup gets the same header, close affordance and
// accent stripe from here, so a new one cannot forget the Escape key.
function shell(o){
  const a = accent(o.accent);
  const m = document.getElementById("modal");
  m.style.setProperty("--a", a);
  m.innerHTML =
    '<div class="m-h">'+
      '<div class="ic" style="background:color-mix(in srgb,'+a+' 14%,transparent);'+
        'color:'+a+'">'+svg(o.icon, 18)+'</div>'+
      '<div><h3>'+esc(o.title)+'</h3><div class="st">'+o.sub+'</div></div>'+
      '<button class="x" id="mx" aria-label="Close">'+
        svg('<path d="M18 6 6 18M6 6l12 12"/>', 14)+'</button>'+
    '</div>'+
    '<div class="m-b">'+o.body+'</div>'+
    '<div class="m-f">'+o.foot+'</div>';
  m.querySelector("#mx").onclick = closeModal;
  const close = m.querySelector("#mclose");
  if (close) close.onclick = closeModal;
}

// ── metric help ──────────────────────────────────────────────────────────────

function fillMetric(i){
  const m = (DATA && DATA.metrics || [])[i];
  if (!m) return;
  const h = m.help || {};
  const rows = (h.rows||[]).map(r =>
    '<div class="r"><span class="k">'+esc(r.k)+'</span>'+
    '<span class="v '+esc(r.cls)+'">'+esc(r.v)+'</span></div>').join("");
  shell({
    accent: m.accent,
    icon: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3 2.4V13"/>'+
      '<path d="M12 16.5h.01"/>',
    title: m.label,
    sub: esc(m.value) + " · " + esc(m.note),
    body:
      '<div class="grp"><h4>What this is</h4><div class="prose">'+esc(h.is||"")+'</div></div>'+
      '<div class="grp"><h4>What it is for</h4><div class="prose">'+esc(h.for||"")+'</div></div>'+
      (rows ? '<div class="grp"><h4>Breakdown</h4>'+rows+'</div>' : ''),
    foot: '<button class="btn" id="mclose">Close</button>',
  });
}

// ── library popup ────────────────────────────────────────────────────────────

// Confirmation state for the reset, kept outside the render so a refresh tick
// repainting the popup does not throw away a half-typed phrase.
let resetArmed = false;
let resetTyped = "";

function fillLibrary(){
  const lib = (DATA && DATA.library) || { roots: [], sections: [] };
  const scan = (DATA && DATA.scan) || { rows: [], running: false };

  const sections = (lib.sections||[]).map(s =>
    '<tr><td style="font-weight:600">'+esc(s.name)+'</td>'+
    '<td>'+esc(s.count)+'</td><td>'+esc(s.size)+'</td>'+
    '<td><span class="tag '+(s.level === "problem" ? "b" : s.level === "busy" ? "w" : "")+'">'+
      esc(s.status)+'</span></td></tr>').join("");

  // Left of the On disk / Missing tag: which sections actually indexed
  // something out of this folder. A root can feed more than one — a camera
  // roll is photos and videos both — so it is a list, and an empty one is a
  // folder nothing has found anything in yet.
  const roots = (lib.roots||[]).length
    ? (lib.roots||[]).map(r => {
        const secs = (r.sections||[]).length
          ? (r.sections||[]).map(s =>
              '<span class="tag sec '+esc(s.toLowerCase())+'">'+esc(s)+'</span>').join("")
          : '<span class="tag sec none">Not indexed</span>';
        return '<div class="r root"><span class="k path">'+esc(r.path)+'</span>'+
          '<span class="v">'+secs+
          '<span class="tag '+esc(r.cls)+'">'+esc(r.state)+'</span></span></div>';
      }).join("")
    : '<div class="empty">No folders are being watched yet. Add one below.</div>';

  // Progress only while something is actually indexing. A bar left at 100%
  // after the fact is indistinguishable from a job that stopped halfway.
  const bars = (scan.rows||[]).map(r => {
    const waiting = r.active && !r.total;
    return '<div class="prog'+(waiting ? ' wait' : r.active ? '' : ' idle')+'">'+
      '<div class="lb"><span>'+esc(r.section)+'</span><span>'+
        (waiting ? "counting files…"
          : esc(r.done)+" / "+esc(r.total)+(r.failed ? " · "+esc(r.failed)+" failed" : ""))+
      '</span></div>'+
      '<div class="tk"><i style="width:'+(waiting ? 35 : (r.pct|0))+'%"></i></div></div>';
  }).join("");

  shell({
    accent: "emerald",
    icon: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    title: "Library",
    sub: esc(lib.items) + " items · " + esc(lib.bytes) + " on disk",
    body:
      '<div class="grp"><h4>What is indexed</h4>'+
        '<table><thead><tr><th>Section</th><th>Items</th><th>Size</th><th>State</th></tr></thead>'+
        '<tbody>'+(sections || '<tr><td colspan="4">Nothing indexed yet.</td></tr>')+'</tbody></table></div>'+
      '<div class="grp"><h4>Watched folders</h4>'+roots+
        '<div class="prose">These are the only paths Tulipix reads. Nothing outside '+
        'them is scanned, and nothing inside them is ever moved or rewritten.</div></div>'+
      (bars ? '<div class="grp"><h4>Reindexing now</h4>'+bars+'</div>' : '')+
      '<div class="danger">'+
        '<h4>Reset Tulipix</h4>'+
        '<p>Erases every index, setting, thumbnail and watched-folder entry, then '+
        'restarts the app as if it had just been installed. <b>Your media files are '+
        'not touched</b> — only what Tulipix has built about them. This cannot be undone.</p>'+
        (resetArmed
          ? '<input type="text" id="rconf" placeholder="Type RESET to confirm" '+
            'value="'+esc(resetTyped)+'" autocomplete="off" spellcheck="false">'
          : '')+
      '</div>',
    foot:
      '<button class="btn calm" id="mclose">Close</button>'+
      '<button class="btn good" id="addf">Add Folder…</button>'+
      '<button class="btn primary" id="reidx"'+(scan.running ? ' disabled' : '')+'>'+
        (scan.running ? "Reindexing…" : "Reindex Library")+'</button>'+
      '<button class="btn bad" id="rst">'+(resetArmed ? "Confirm Reset" : "Reset App")+'</button>',
  });

  const m = document.getElementById("modal");
  m.querySelector("#addf").onclick = async e => {
    // The picker opens in the app, not here — a browser file input hands back
    // bytes without a path, which is not what a watched folder is.
    const b = e.currentTarget;
    b.disabled = true;
    b.textContent = "Check Tulipix…";
    await post("/api/add-folder");
    setTimeout(() => { b.disabled = false; b.textContent = "Add Folder…"; }, 3000);
  };
  m.querySelector("#reidx").onclick = e => {
    e.currentTarget.disabled = true;
    post("/api/rescan");
  };
  const conf = m.querySelector("#rconf");
  if (conf) {
    conf.oninput = () => { resetTyped = conf.value; };
    conf.focus();
    // Caret to the end: the popup re-renders on every 2s tick and a naive
    // focus() would otherwise drop the cursor to the front mid-word.
    conf.setSelectionRange(conf.value.length, conf.value.length);
  }
  m.querySelector("#rst").onclick = () => {
    if (!resetArmed) { resetArmed = true; fillLibrary(); return; }
    if (resetTyped.trim() !== "RESET") { alert("Type RESET to confirm."); return; }
    resetArmed = false;
    post("/api/reset", { confirm: "RESET" });
    closeModal();
  };
}

// ── boot ─────────────────────────────────────────────────────────────────────

function toggleTheme(){
  const r = document.documentElement;
  const dark = r.getAttribute("data-theme") === "dark";
  r.setAttribute("data-theme", dark ? "light" : "dark");
  document.getElementById("tglIcon").textContent = dark ? "🌙" : "☀️";
  document.getElementById("tglTxt").textContent = dark ? "Dark" : "Light";
  try { localStorage.setItem("tulipix-status-theme", dark ? "light" : "dark"); } catch (e) {}
}

(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem("tulipix-status-theme"); } catch (e) {}
  const dark = saved ? saved === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  if (dark) {
    document.documentElement.setAttribute("data-theme", "dark");
    document.getElementById("tglIcon").textContent = "☀️";
    document.getElementById("tglTxt").textContent = "Light";
  }
})();

document.getElementById("yr").textContent = new Date().getFullYear();

document.getElementById("scrim").addEventListener("click", e => {
  if (e.target.id === "scrim") closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
// A tab coming back to the foreground should not wait out the interval.
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

tick();
setInterval(tick, 2000);
setInterval(heartbeat, 1000);
</script>
</body>
</html>
