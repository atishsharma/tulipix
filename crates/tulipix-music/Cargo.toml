[package]
name = "tulipix-music"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
sqlx.workspace = true
reqwest = { workspace = true, features = ["json"] }
# Last.fm API signatures are MD5 by spec (np.p5.music.scrobble).
md-5 = "0.11"
# YouTube thumbnail/avatar fetch decodes remote jpg/webp/png and re-encodes PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Stable per-folder cache stems for audiobook art (ab_meta), spelled the
# same way in both front ends so they share the one cache directory.
sha2.workspace = true
# Trend-feed fetches that fail are worth a line in the log, not a silent gap.
tracing.workspace = true
tulipix-core = { path = "../tulipix-core" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# False positives: exif is the `kamadak-exif` crate; md-5→`md5`; reqwest
# used via full path; tulipix-* are optional deps pulled in by feature flags.
[package.metadata.cargo-machete]
ignored = ["md-5"]
