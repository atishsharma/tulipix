[package]
name = "tulipix-sec-finances"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Finances-section wiring: the bridge between tulipix-finances — which is async,
# integer-only and knows nothing about Slint — and every `window.on_fin_*`
# callback. tulipix-app calls `wire(&window)` once at startup and
# `section_changed(&window, s)` from the sidebar hook.
#
# This crate is also where money becomes text. `tulipix-finances` deals only in
# `i64` minor units; the formatter lives at this boundary and nowhere else, which
# is what keeps a decimal point out of the data model.

[features]
# Forward live-reload to the UI crate so a dev-reload app build keeps the
# generated UI types in sync (slint/live-preview swaps them out).
dev-reload = ["tulipix-ui/dev-reload"]
# Dev-only: lets `cargo check -p tulipix-sec-finances` satisfy slint's winit
# backend renderer requirement in isolation (the app normally selects it).
_check = ["slint/renderer-skia", "slint/renderer-skia-opengl"]

[dependencies]
slint.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
sqlx.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tulipix-ui = { path = "../tulipix-ui" }
tulipix-core = { path = "../tulipix-core" }
tulipix-finances = { path = "../tulipix-finances" }
# For `replace_rows`: every list in this section is redrawn by buttons that live
# inside its own rows, which is exactly the slint#6426 trash-crash case that
# helper exists for. Same reason sec-transfer and sec-cloud depend on it.
tulipix-sec-photos = { path = "../tulipix-sec-photos" }
tulipix-platform = { path = "../tulipix-platform" }
