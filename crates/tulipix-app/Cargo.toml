[package]
name = "tulipix-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local-first media suite: photos, videos, music, books, tools and rclone cloud in one app."

[[bin]]
name = "tulipix"
path = "src/main.rs"

[features]
# Lean default — only the always-on subsystems are linked. Optional crates
# (whisper, AI execution providers, large models, plugin sandboxes) are
# behind their own feature flag so the base binary stays ~40% smaller and
# loads them lazily on first use.
# There was an `embedded-mpv` feature here: libmpv linked into the process,
# rendering into a Slint texture. It was removed, along with the tulipix-player
# crate and ui/player.slint. The render path blocked Slint's render thread on
# weak iGPUs and every play call site had already been routed to an external mpv
# window; nothing set `player-open`, so the overlay could not be reached at all.
# All playback — Videos, Live TV, music, podcasts, radio, YouTube — is
# out-of-process mpv, driven over its IPC socket, which also gets mpv's own OSC
# for embedded audio/subtitle tracks for free. See tulipix_common::spawn_mpv_*.
#
# alloc-mimalloc on by default: 10-20% on the thumb pipeline + DB pool. The
# global_allocator is cfg-gated to Linux/Windows (macOS keeps system malloc),
# so this is a no-op allocator-wise on mac.
default = ["renderer-skia", "alloc-mimalloc", "genesis", "finances"]
# Genesis — book search and download inside Books. Gated so a build that should
# not carry it drops the crate entirely rather than shipping it switched off.
genesis = ["dep:tulipix-sec-genesis"]
# Finances — the household-money section. Gated the same way, and named in BOTH
# `default` above and the `run-dev-lite` feature list in the justfile: that
# recipe passes --no-default-features, so a section added only to `default`
# ships dead in the lite build. Genesis was broken for a cycle exactly that way.
finances = ["dep:tulipix-sec-finances"]
# Renderer selection (Slint feature-unifies, so pick exactly one).
#   skia    — default; GPU, best text/AA. Larger binary, needs the skia-bindings
#             C++ build.
#   femtovg — size-lean GPU renderer for a "lite" build, and a far faster cold
#             build. No longer excludes anything — pair with
#             --no-default-features and re-add the sections:
#               cargo build -p tulipix-app --release --no-default-features \
#                 --features renderer-femtovg,alloc-mimalloc,genesis,finances
renderer-skia = ["slint/renderer-skia", "slint/renderer-skia-opengl"]
renderer-femtovg = ["slint/renderer-femtovg"]

# Dev UI live-reload. `slint/live-preview` swaps the generated UI for an
# interpreter-backed LiveReloadingComponent that re-reads .slint at runtime —
# the build must ALSO run with SLINT_LIVE_PREVIEW=1 so the slint compiler
# emits the live-preview glue (see vendor/i-slint-compiler/generator/rust.rs).
dev-reload = ["dep:notify", "slint/live-preview", "tulipix-ui/dev-reload", "tulipix-sec-tools/dev-reload", "tulipix-sec-transfer/dev-reload", "tulipix-sec-photos/dev-reload", "tulipix-sec-music/dev-reload", "tulipix-sec-videos/dev-reload", "tulipix-sec-cloud/dev-reload", "tulipix-sec-genesis?/dev-reload", "tulipix-sec-finances?/dev-reload", "tulipix-sec-status/dev-reload"]

# Dev-only Rust hot-patch. Routes section wire-up through the tulipix-hot dylib
# (loaded by hot-lib-reloader): edit section callback logic, rebuild that small
# dylib, and the RUNNING app re-wires — no restart, no main.rs (9.5k) recompile.
# Implies dev-reload so the dylib + app share one interpreter-backed MainWindow
# layout across the .so boundary. Drive it with `just hot` + `just hot-lib`.
hot = ["dev-reload", "dep:hot-lib-reloader", "dep:tulipix-hot", "tulipix-hot/dev-reload"]

# Real ONNX editor AI ops (upscale/colorize/heal/sky). Pulls ORT into
# tulipix-photos (downloads the native runtime at build time).
ai-onnx = ["tulipix-photos/onnx", "tulipix-sec-photos/ai-onnx"]

# Neural read-aloud (Kokoro-82M) in the Books reader. Pulls ORT into
# tulipix-books; runtime falls back to timer highlight without the model.
books-tts = ["tulipix-sec-books/kokoro"]

# Global allocator. mimalloc on Win/Linux gives 10-20% perf on the thumb
# pipeline + DB pool; macOS keeps system malloc (jemalloc nightly-only).
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator"]

# There were three "lazy subsystem" flags here — lazy-whisper, lazy-ai-ep and
# lazy-plugins — described as resolving their crate's entrypoints on first call
# behind TULIPIX_ENABLE_* env vars. No such env var is read anywhere, and
# tulipix_whisper, tulipix_ai and tulipix_plugins have no call sites in the
# workspace at all, so the flags only linked 2,191 lines of unreachable code into
# every packaged build. Whisper is in fact used through the bundled whisper-cli
# binary, not the crate.
#
# The crates remain in the workspace with their tests; they are simply not linked
# until something calls them. Re-add a dependency at the point of use.

# Convenience alias for the packaging build: everything that is actually wired.
full = ["ai-onnx"]

[dependencies]
slint.workspace = true
tulipix-ui = { path = "../tulipix-ui" }
tulipix-common = { path = "../tulipix-common" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
notify = { version = "8", optional = true }   # keep in step with tulipix-core
# Dev-only hot-patch runtime + the section-wiring dylib it loads. Both optional,
# pulled in ONLY by the `hot` feature, so default/release builds never see them.
hot-lib-reloader = { version = "0.7", optional = true }
tulipix-hot = { path = "../tulipix-hot", optional = true }
tulipix-core = { path = "../tulipix-core" }
# `tray` on by default — np.p1.tray needs the real tray-icon backend, the
# stub returned false and System claimed "Active" wrongly.
tulipix-platform = { path = "../tulipix-platform", features = ["tray"] }
tulipix-photos = { path = "../tulipix-photos" }
tulipix-videos = { path = "../tulipix-videos" }
tulipix-music = { path = "../tulipix-music" }
tulipix-sec-tools = { path = "../tulipix-sec-tools" }
tulipix-sec-transfer = { path = "../tulipix-sec-transfer" }
tulipix-sec-genesis = { path = "../tulipix-sec-genesis", optional = true }
tulipix-sec-finances = { path = "../tulipix-sec-finances", optional = true }
tulipix-sec-photos = { path = "../tulipix-sec-photos" }
tulipix-sec-music = { path = "../tulipix-sec-music" }
tulipix-sec-videos = { path = "../tulipix-sec-videos" }
tulipix-sec-cloud = { path = "../tulipix-sec-cloud" }
tulipix-sec-books = { path = "../tulipix-sec-books" }
# Status — the loopback dashboard the sidebar button opens in a browser. Not a
# `sec-` crate because it wires no Slint page: its whole UI is HTML.
tulipix-status = { path = "../tulipix-status" }
# The native twin of that dashboard. Turns the same snapshot into the models
# `page_status.slint` draws, so the two renderings can be compared live.
tulipix-sec-status = { path = "../tulipix-sec-status" }
tulipix-books = { path = "../tulipix-books" }
sqlx = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
walkdir = "2"
# OS media-key / now-playing integration (Linux MPRIS · Windows SMTC · macOS).
souvlaki = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
sha2 = "0.10"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
tikv-jemallocator = { version = "0.6", optional = true }

# System light/dark detection. On Linux that is one XDG settings-portal read, and
# rfd's xdg-portal backend already links ashpd 0.11 on zbus/tokio — so we call it
# directly (`detect_dark`). dark-light v2 wrapped the same call but brought its
# own ashpd 0.10, which enables `zbus/async-io` and so pulled async-std +
# async-io/-fs/-net/-global-executor into every Linux build: a second async
# runtime for one boolean.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }

# Off Linux, dark-light IS the value: the Windows registry read and the macOS
# AppleInterfaceStyle lookup. Neither drags an extra runtime there.
[target.'cfg(not(target_os = "linux"))'.dependencies]
dark-light = "2"

# libc was declared here for PR_SET_PDEATHSIG, but mpv_die_with_parent lives in
# tulipix-common and that is where the dependency belongs; this crate never
# named libc.

# raw-window-handle pins to Slint 1.8's rwh (0.6); used to hand the native HWND
# to souvlaki — SMTC on Windows panics without one.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
# slint-build moved to the tulipix-ui crate (it owns the .slint codegen).

# Embed the .ico as a Win32 resource so the .exe (and, via winit's default,
# the window/taskbar) carries the Tulipix icon.
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

# ── Linux packaging (CI release builds) ──────────────────────────────────────
# Layout: real binary + bundled tools under /opt/tulipix (tool_bin() walks up
# from the executable to find resources/bin/<os-arch>/), thin /usr/bin shim.
[package.metadata.deb]
name = "tulipix"
extended-description = "Local-first media suite: photos, videos, music, books, tools and rclone cloud in one app. Bundles ffmpeg, yt-dlp, whisper, rclone and exiftool."
# $auto resolves shared-lib deps (libmpv, GL, …) from the built binary.
depends = "$auto, mpv, fuse3, perl"
assets = [
  ["target/release/tulipix", "opt/tulipix/tulipix", "755"],
  ["../../resources/bin/linux-x86_64/**/*", "opt/tulipix/resources/bin/linux-x86_64/", "755"],
  ["../../packaging/linux/tulipix-launcher", "usr/bin/tulipix", "755"],
  ["../../packaging/linux/tulipix.desktop", "usr/share/applications/tulipix.desktop", "644"],
  ["../../resources/icons/tulipix-256.png", "usr/share/icons/hicolor/256x256/apps/tulipix.png", "644"],
]

[package.metadata.generate-rpm]
name = "tulipix"
# Built on an Ubuntu runner — no rpm find-requires there; declare by hand.
auto-req = "no"
assets = [
  { source = "target/release/tulipix", dest = "/opt/tulipix/tulipix", mode = "755" },
  { source = "resources/bin/linux-x86_64/**/*", dest = "/opt/tulipix/resources/bin/linux-x86_64/", mode = "755" },
  { source = "packaging/linux/tulipix-launcher", dest = "/usr/bin/tulipix", mode = "755" },
  { source = "packaging/linux/tulipix.desktop", dest = "/usr/share/applications/tulipix.desktop", mode = "644" },
  { source = "resources/icons/tulipix-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/tulipix.png", mode = "644" },
]
[package.metadata.generate-rpm.requires]
mpv = "*"
fuse3 = "*"
perl = "*"

# False positive: `exif` is the lib name of the `kamadak-exif` crate. The
# tulipix-ai / tulipix-plugins / tulipix-whisper entries are gone with the
# dependencies themselves — they were not false positives, they were unused.
[package.metadata.cargo-machete]
ignored = ["kamadak-exif", "tulipix-hot"]
