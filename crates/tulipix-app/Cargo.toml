[package]
name = "tulipix-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local-first media suite: photos, videos, music, books, tools and rclone cloud in one app."

[[bin]]
name = "tulipix"
path = "src/main.rs"

[features]
# Lean default — only the always-on subsystems are linked. Optional crates
# (whisper, AI execution providers, large models, plugin sandboxes) are
# behind their own feature flag so the base binary stays ~40% smaller and
# loads them lazily on first use.
# `embedded-mpv` on by default: links libmpv for the in-app Videos player
# (render API → Slint texture) and forces the skia-opengl renderer. Build with
# `--no-default-features` to drop the libmpv link entirely (e.g. Windows without
# mpv.lib); the Videos embedded player goes inert, while music/podcast/radio/
# YouTube keep using out-of-process mpv.exe. Because the renderer rides on
# embedded-mpv, a `--no-default-features` build MUST add a renderer feature —
# `--features renderer-skia` (parity) or `--features renderer-femtovg` (lean).
# See build.rs + src/mpv_stub.rs.
# alloc-mimalloc on by default: 10-20% on the thumb pipeline + DB pool. The
# global_allocator is cfg-gated to Linux/Windows (macOS keeps system malloc),
# so this is a no-op allocator-wise on mac.
default = ["embedded-mpv", "alloc-mimalloc"]
# The embedded player hands libmpv frames to Slint as a BorrowedOpenGLTexture,
# which only the skia-opengl surface provides — so embedded-mpv pulls skia.
embedded-mpv = ["renderer-skia"]

# Renderer selection (Slint feature-unifies, so pick exactly one).
#   skia    — default; GPU, best text/AA, required by embedded-mpv. Larger binary.
#   femtovg — size-lean GPU renderer for a "lite" build. Incompatible with the
#             in-app video player, so pair it with --no-default-features:
#               cargo build -p tulipix-app --release --no-default-features --features renderer-femtovg
renderer-skia = ["slint/renderer-skia", "slint/renderer-skia-opengl"]
renderer-femtovg = ["slint/renderer-femtovg"]

# Dev UI live-reload. `slint/live-preview` swaps the generated UI for an
# interpreter-backed LiveReloadingComponent that re-reads .slint at runtime —
# the build must ALSO run with SLINT_LIVE_PREVIEW=1 so the slint compiler
# emits the live-preview glue (see vendor/i-slint-compiler/generator/rust.rs).
dev-reload = ["dep:notify", "slint/live-preview", "tulipix-ui/dev-reload", "tulipix-sec-tools/dev-reload", "tulipix-sec-photos/dev-reload", "tulipix-sec-music/dev-reload", "tulipix-sec-videos/dev-reload", "tulipix-sec-cloud/dev-reload", "tulipix-sec-books/dev-reload"]

# Dev-only Rust hot-patch. Routes section wire-up through the tulipix-hot dylib
# (loaded by hot-lib-reloader): edit section callback logic, rebuild that small
# dylib, and the RUNNING app re-wires — no restart, no main.rs (9.5k) recompile.
# Implies dev-reload so the dylib + app share one interpreter-backed MainWindow
# layout across the .so boundary. Drive it with `just hot` + `just hot-lib`.
hot = ["dev-reload", "dep:hot-lib-reloader", "dep:tulipix-hot", "tulipix-hot/dev-reload"]

# Real ONNX editor AI ops (upscale/colorize/heal/sky). Pulls ORT into
# tulipix-photos (downloads the native runtime at build time).
ai-onnx = ["tulipix-photos/onnx", "tulipix-sec-photos/ai-onnx"]

# Global allocator. mimalloc on Win/Linux gives 10-20% perf on the thumb
# pipeline + DB pool; macOS keeps system malloc (jemalloc nightly-only).
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator"]

# Lazy subsystem feature flags. The app reads matching env vars at runtime
# (TULIPIX_ENABLE_WHISPER=1 …) and only resolves the crate's entrypoints on
# first call, so the cold-start path does not pay their startup cost.
lazy-whisper = ["dep:tulipix-whisper"]
lazy-ai-ep   = ["dep:tulipix-ai"]
lazy-plugins = ["dep:tulipix-plugins"]

# Convenience: turn everything on (used for the official packaging build).
full = ["lazy-whisper", "lazy-ai-ep", "lazy-plugins"]

[dependencies]
slint.workspace = true
tulipix-ui = { path = "../tulipix-ui" }
tulipix-common = { path = "../tulipix-common" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# v2 detects via XDG settings portal (ashpd/zbus5, already in-tree through
# rfd) — v1 dragged a second, duplicate zbus4 + dbus stack (~15 crates).
dark-light = "2"
notify = { version = "6", optional = true }
# Dev-only hot-patch runtime + the section-wiring dylib it loads. Both optional,
# pulled in ONLY by the `hot` feature, so default/release builds never see them.
hot-lib-reloader = { version = "0.7", optional = true }
tulipix-hot = { path = "../tulipix-hot", optional = true }
tulipix-core = { path = "../tulipix-core" }
# `tray` on by default — np.p1.tray needs the real tray-icon backend, the
# stub returned false and System claimed "Active" wrongly.
tulipix-platform = { path = "../tulipix-platform", features = ["tray"] }
tulipix-photos = { path = "../tulipix-photos" }
tulipix-videos = { path = "../tulipix-videos" }
tulipix-player = { path = "../tulipix-player" }
tulipix-music = { path = "../tulipix-music" }
tulipix-books = { path = "../tulipix-books" }
tulipix-sec-tools = { path = "../tulipix-sec-tools" }
tulipix-sec-photos = { path = "../tulipix-sec-photos" }
tulipix-sec-music = { path = "../tulipix-sec-music" }
tulipix-sec-videos = { path = "../tulipix-sec-videos" }
tulipix-sec-cloud = { path = "../tulipix-sec-cloud" }
tulipix-sec-books = { path = "../tulipix-sec-books" }
sqlx = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
walkdir = "2"
# OS media-key / now-playing integration (Linux MPRIS · Windows SMTC · macOS).
souvlaki = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
sha2 = "0.10"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tulipix-whisper = { path = "../tulipix-whisper", optional = true }
tulipix-ai = { path = "../tulipix-ai", optional = true }
tulipix-plugins = { path = "../tulipix-plugins", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
tikv-jemallocator = { version = "0.6", optional = true }

# PR_SET_PDEATHSIG (mpv_die_with_parent) is the only libc use — Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# raw-window-handle pins to Slint 1.8's rwh (0.6); used to hand the native HWND
# to souvlaki — SMTC on Windows panics without one.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
# slint-build moved to the tulipix-ui crate (it owns the .slint codegen).

# Embed the .ico as a Win32 resource so the .exe (and, via winit's default,
# the window/taskbar) carries the Tulipix icon.
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

# ── Linux packaging (CI release builds) ──────────────────────────────────────
# Layout: real binary + bundled tools under /opt/tulipix (tool_bin() walks up
# from the executable to find resources/bin/<os-arch>/), thin /usr/bin shim.
[package.metadata.deb]
name = "tulipix"
extended-description = "Local-first media suite: photos, videos, music, books, tools and rclone cloud in one app. Bundles ffmpeg, yt-dlp, whisper, rclone and exiftool."
# $auto resolves shared-lib deps (libmpv, GL, …) from the built binary.
depends = "$auto, mpv, fuse3, perl"
assets = [
  ["target/release/tulipix", "opt/tulipix/tulipix", "755"],
  ["../../resources/bin/linux-x86_64/**/*", "opt/tulipix/resources/bin/linux-x86_64/", "755"],
  ["../../packaging/linux/tulipix-launcher", "usr/bin/tulipix", "755"],
  ["../../packaging/linux/tulipix.desktop", "usr/share/applications/tulipix.desktop", "644"],
  ["../../resources/icons/tulipix-256.png", "usr/share/icons/hicolor/256x256/apps/tulipix.png", "644"],
]

[package.metadata.generate-rpm]
name = "tulipix"
# Built on an Ubuntu runner — no rpm find-requires there; declare by hand.
auto-req = "no"
assets = [
  { source = "target/release/tulipix", dest = "/opt/tulipix/tulipix", mode = "755" },
  { source = "resources/bin/linux-x86_64/**/*", dest = "/opt/tulipix/resources/bin/linux-x86_64/", mode = "755" },
  { source = "packaging/linux/tulipix-launcher", dest = "/usr/bin/tulipix", mode = "755" },
  { source = "packaging/linux/tulipix.desktop", dest = "/usr/share/applications/tulipix.desktop", mode = "644" },
  { source = "resources/icons/tulipix-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/tulipix.png", mode = "644" },
]
[package.metadata.generate-rpm.requires]
mpv = "*"
fuse3 = "*"
perl = "*"

# False positives: exif is the `kamadak-exif` crate; md-5→`md5`; reqwest
# used via full path; tulipix-* are optional deps pulled in by feature flags.
[package.metadata.cargo-machete]
ignored = ["kamadak-exif", "tulipix-ai", "tulipix-hot", "tulipix-plugins", "tulipix-whisper"]
