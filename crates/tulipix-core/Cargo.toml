[package]
name = "tulipix-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
keyring.workspace = true
sqlx.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
# notify 8, not 6: 6 pulls its own `mio 0.8` + `inotify 0.9` alongside the
# `mio 1.x` tokio already links, so the tree carried two copies of the Linux
# event loop. 8 is API-compatible for what the watcher uses (Watcher::new with
# a std mpsc Sender, Config, EventKind, event::ModifyKind, RecursiveMode).
notify = "8"
walkdir = "2"
# The MCP server's ToolHandler: the protocol lives in core, the answers live
# where the databases are, and an async trait object is the seam. Already in
# the tree under tulipix-videos.
async-trait = "0.1"
tokio = { workspace = true }
# In-process photo decode for the thumbnail cache, so a JPEG/PNG thumb does not
# cost an ffmpeg subprocess. Same version and feature set as tulipix-photos and
# tulipix-sec-photos (and Slint's own dependency), so cargo unifies it and this
# adds nothing to the build that was not already being compiled.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
