[package]
name = "tulipix-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
# The JSONL sink's `tracing` layer (`logging::FileLayer`). Both front ends own a
# `tracing-subscriber` already; the layer lives here so each installs the same
# one with a single line rather than keeping a copy of it.
#
# Pinned rather than inherited, with no features at all: implementing `Layer`
# needs only `tracing_subscriber::layer`, which is ungated. Taking the
# workspace entry would take its defaults (ansi, tracing-log, smallvec) with
# it, and cargo unifies features across the graph -- so this one line would
# silently undo the `default-features = false` the bridge sets on the same
# crate, and put nu-ansi-term back into a build that had dropped it.
tracing-subscriber = { version = "0.3", default-features = false }
keyring.workspace = true
sqlx.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
# notify 8, not 6: 6 pulls its own `mio 0.8` + `inotify 0.9` alongside the
# `mio 1.x` tokio already links, so the tree carried two copies of the Linux
# event loop. 8 is API-compatible for what the watcher uses (Watcher::new with
# a std mpsc Sender, Config, EventKind, event::ModifyKind, RecursiveMode).
notify = "8"
walkdir = "2"
# The MCP server's ToolHandler: the protocol lives in core, the answers live
# where the databases are, and an async trait object is the seam. Already in
# the tree under tulipix-videos.
async-trait = "0.1"
# Challenges for the security-key enrolment and assertion. Already in the tree
# under rustls; no separate RNG crate.
getrandom.workspace = true
tokio = { workspace = true }
# In-process photo decode for the thumbnail cache, so a JPEG/PNG thumb does not
# cost an ffmpeg subprocess. Same version and feature set as tulipix-photos, so
# cargo unifies it and this adds nothing to the build.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

[features]
# SQLCipher, compiled in. Off by default, so `just dev` and the library tests
# do not build SQLCipher; release and profile builds turn it on through
# crates/tulipix-bridge/cargokit.yaml. With it, Settings › Security ›
# "Encrypt the library database" works; without it, that row says so.
#
# libsqlite3-sys is not used directly -- it is here so cargo's feature
# unification gives sqlx-sqlite a SQLCipher-flavoured SQLite to link against.
db-encrypt = ["dep:libsqlite3-sys"]

[dependencies.libsqlite3-sys]
version = "0.37"
features = ["bundled-sqlcipher"]
optional = true

# SQLCipher's crypto per OS: macOS uses CommonCrypto, Linux links the system
# libcrypto (build needs its headers, libssl-dev), and Windows has no system
# OpenSSL to find -- the build panics without OPENSSL_DIR -- so OpenSSL is
# compiled in from source there. That needs Perl (Strawberry, not Git's).
[target.'cfg(windows)'.dependencies.libsqlite3-sys]
version = "0.37"
features = ["bundled-sqlcipher-vendored-openssl"]
optional = true

# libsqlite3-sys is never named in the code: it is a link-time swap for
# sqlx's SQLite, pulled in by feature unification.
[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
