[package]
name = "tulipix-sec-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Tools-section wiring: the declarative form bridge, job-queue worker/executor
# glue, and all `window.on_tools_*` callbacks. tulipix-app calls `wire(&window)`.

[features]
# Forward live-reload to the UI crate so a dev-reload app build keeps the
# generated UI types in sync (slint/live-preview swaps them out).
dev-reload = ["tulipix-ui/dev-reload"]

[dependencies]
slint.workspace = true
tokio.workspace = true
anyhow.workspace = true
# The yt-dlp self-update reports through the same channel every other crate
# diagnoses itself on; a failed update that says nothing anywhere is how the
# bundled binary went stale unnoticed in the first place.
tracing.workspace = true
sqlx = { workspace = true }
serde_json.workspace = true
walkdir = "2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
tulipix-ui = { path = "../tulipix-ui" }
tulipix-common = { path = "../tulipix-common" }
tulipix-core = { path = "../tulipix-core" }
tulipix-platform = { path = "../tulipix-platform" }
tulipix-tools = { path = "../tulipix-tools" }

[target.'cfg(unix)'.dependencies]
# SIGINT for graceful job cancel (lets yt-dlp/ffmpeg finalize output files).
libc = "0.2"
