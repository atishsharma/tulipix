[package]
name = "tulipix-hot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Dev-only hot-reload shim. Re-exports each section's `wire(&MainWindow)` from a
# Rust `dylib` so hot-lib-reloader can swap the section callback logic into a
# RUNNING app — no restart, and crucially no recompile of the 9.5k-line
# tulipix-app/main.rs monolith. Never pulled by release/normal builds: only the
# `just hot` flow (tulipix-app's `hot` feature) loads this .so.
#
# crate-type "dylib" (Rust ABI, NOT cdylib): the proxied functions pass real
# Slint types (`&MainWindow`), which are not #[repr(C)]. That is sound ONLY
# because `just hot` builds this dylib AND the host app with the identical
# toolchain + feature set, so both agree on the type layout.

[lib]
crate-type = ["rlib", "dylib"]

[features]
# Must mirror the app: a dev-reload app uses Slint's interpreter-backed
# MainWindow; the dylib has to be built the same way or the type layout (and
# thus every `&MainWindow` crossing the boundary) diverges.
dev-reload = ["tulipix-ui/dev-reload", "tulipix-sec-tools/dev-reload"]

[dependencies]
slint.workspace = true
tulipix-ui = { path = "../tulipix-ui" }
tulipix-sec-tools = { path = "../tulipix-sec-tools" }
