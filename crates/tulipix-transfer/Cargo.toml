[package]
name = "tulipix-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Local file transfer over Wi-Fi / hotspot: the desktop serves a small web page,
# a phone browser downloads what is shared and uploads into the inbox. No Slint
# types cross this boundary, so the whole crate runs in CI's light `test` job.

[dependencies]
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
getrandom.workspace = true
if-addrs.workspace = true
# The `tulipix.local` record. Best-effort by design — see src/mdns.rs.
mdns-sd = "0.13"
# The app's own CA and the leaf it signs. `ring` to match the rustls provider
# already resolved in this tree; the default would be free to pick aws-lc-rs and
# link a second crypto library in beside it.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The client half of peer-to-peer. Already resolved in this tree; `cookies` is
# how a peer carries the same device token a browser does.
reqwest = { workspace = true, features = ["cookies", "json", "stream"] }
# Reading the ACME chain and key back off disk. rcgen writes PEM but does not
# read it, and rustls wants DER; this is the two-function crate that bridges
# them, and it is already in the tree under hyper-rustls.
rustls-pemfile = "2"
# SHA-256 of the leaf, for the fingerprint the trust-on-first-use flow is checked
# against. Already compiled in this tree — rcgen and rustls below both resolve to
# it — so naming it here costs a line and nothing else.
ring = "0.17"
# For `#[derive(Deserialize)]` on request bodies. Already in the lockfile under
# serde_json below; naming it directly is what makes the derive available here.
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# `net` for the listener: the workspace default trims tokio to what the media
# crates use, and nothing there binds a socket.
tokio = { workspace = true, features = ["net", "io-util", "time", "rt"] }
# Already in the tree under reqwest, so this costs no new dependency — only the
# feature that lets us be the server end rather than the client end.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Streaming a file into a request body without reading it into memory first —
# a 12 GB push must not become a 12 GB allocation.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tracing.workspace = true
tulipix-core = { path = "../tulipix-core" }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
