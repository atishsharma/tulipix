# Capability registry — single source of truth for what each tier may do.
# Loaded by tulipix-core::caps. Schema-validated, hot-reloadable in dev.

[tiers]
local_basic   = ["platform.share-sheet", "mcp.server"]
local_pro     = ["photos.scan", "videos.scan", "music.scan", "books.scan", "cloud.mount", "ai.face-cluster", "photos.ai.captions", "ai.voice", "ai.cloud-offload", "mcp.server", "mcp.server.write", "platform.share-sheet"]
account_free  = ["photos.scan", "videos.scan", "music.scan", "books.scan", "platform.share-sheet", "mcp.server"]
account_plus  = ["photos.scan", "videos.scan", "music.scan", "books.scan", "cloud.mount", "ai.face-cluster", "ai.upscale", "photos.ai.captions", "ai.voice", "platform.share-sheet", "mcp.server"]
account_pro   = ["photos.scan", "videos.scan", "music.scan", "books.scan", "cloud.mount", "ai.face-cluster", "ai.upscale", "ai.stem-separation", "ai.tts", "sync.enabled", "photos.ai.captions", "ai.voice", "ai.cloud-offload", "mcp.server", "mcp.server.write", "platform.share-sheet"]
admin         = ["*"]
guest         = []
kid           = ["photos.scan", "videos.scan", "music.scan", "books.scan", "platform.share-sheet"]

# Per-service quotas for app-default API keys (per-day count).
