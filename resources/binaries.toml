# Bundled binaries manifest. SHA-256 values MUST be filled before shipping.
# Placeholder hashes ("TBD") cause fetch-resources to fail safely.

# ffmpeg/ffprobe are NOT bundled — resolved from system PATH via tool_bin's
# fallback. The BtbN full-static GPL builds were ~194 MB each (+136 MB orphan
# archive); unbundling drops the install from 718 MB to ~194 MB. To re-bundle
# later, restore the [[binary]] block AND add a tar.xz extractor to
# fetch-resources (the `archive = "tar.xz"` arm currently raw-saves, never
# unpacks — that bug is what left the orphan .bin). Prefer a `-gpl-shared`
# build (tiny binaries + shared libav*.so) over the full static one.

# whisper.cpp main executable.
# Windows prebuilt ships upstream; other platforms build from pinned source tarball
# during installer-prep (see scripts/build-whisper.sh).
[[binary]]
name = "whisper-cli"
version = "1.8.4"
