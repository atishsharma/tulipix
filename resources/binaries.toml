# ffmpeg + ffprobe — bundled on every OS for the self-contained release build.
# johnvansickle (Linux) + gyan.dev (Windows) rolling stable URLs; martin-riedl.de static
# builds for macOS (ffmpeg/ffprobe ship as separate zips there — see the
# `ffprobe` binary block below). Archives keep exes under `bin/`; they are
# flattened to resources/bin/<os-arch>/.
[[binary]]
name = "ffmpeg"
version = "latest"
[[binary.sources]]
os = "linux"
arch = "x86_64"
url = "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
sha256 = "latest"
archive = "tar.xz"
extract = ["ffmpeg", "ffprobe"]
latest = true
[[binary.sources]]
os = "macos"
arch = "aarch64"
url = "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
sha256 = "latest"
archive = "zip"
latest = true
[[binary.sources]]
os = "macos"
arch = "x86_64"
url = "https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip"
sha256 = "latest"
archive = "zip"
latest = true
[[binary.sources]]
os = "windows"
arch = "x86_64"
url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
sha256 = "latest"
archive = "zip"
extract = ["bin/ffmpeg.exe", "bin/ffprobe.exe"]
latest = true

# mpv — WINDOWS ONLY (Linux/macOS use system mpv or the Tools-directory setting).
# Bundles the standalone player `mpv.exe` (spawned for video playback). The
# SourceForge "64bit/latest" link always redirects to the newest shinchiro .7z;
# `mpv.com` (the console wrapper) comes along too. NOTE: this is the player, not
# `libmpv` — the embedded audio path still needs mpv-2.dll (mpv-dev) at runtime.
[[binary]]
name = "mpv"
version = "latest"
[[binary.sources]]
os = "windows"
arch = "x86_64"
url = "https://sourceforge.net/projects/mpv-player-windows/files/64bit/latest/download"
sha256 = "latest"
archive = "7z"
extract = ["mpv.exe", "mpv.com"]
latest = true

