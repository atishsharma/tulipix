# yt-dlp — always the rolling LATEST release (YouTube breaks often; a pinned
# 2024 build goes stale). `latest = true` skips the sha pin + re-fetches every
# run. In-app self-update channel also lives in tulipix-core::updater.
# macOS asset is a universal binary (x86_64 + arm64).
[[binary]]
name = "yt-dlp"
version = "latest"
[[binary.sources]]
os = "linux"
arch = "x86_64"
url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
sha256 = "latest"
archive = "none"
latest = true
[[binary.sources]]
os = "linux"
arch = "aarch64"
url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64"
sha256 = "latest"
archive = "none"
latest = true
[[binary.sources]]
os = "windows"
arch = "x86_64"
url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
sha256 = "latest"
archive = "none"
latest = true
[[binary.sources]]
os = "macos"
arch = "x86_64"
url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
sha256 = "latest"
archive = "none"
latest = true
[[binary.sources]]
os = "macos"
arch = "aarch64"
url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
sha256 = "latest"
archive = "none"
latest = true

# ffmpeg + ffprobe — WINDOWS ONLY (Linux/macOS resolve from system PATH or the
# Tools-directory setting). BtbN rolling "latest" GPL zip; both exes live under
# `bin/` in the archive and are flattened to resources/bin/windows-x86_64/.
[[binary]]
name = "ffmpeg"
version = "latest"
[[binary.sources]]
os = "windows"
arch = "x86_64"
url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
sha256 = "latest"
archive = "zip"
extract = ["bin/ffmpeg.exe", "bin/ffprobe.exe"]
latest = true

# mpv — WINDOWS ONLY (Linux/macOS use system mpv or the Tools-directory setting).
# Bundles the standalone player `mpv.exe` (spawned for video playback). The
# SourceForge "64bit/latest" link always redirects to the newest shinchiro .7z;
# `mpv.com` (the console wrapper) comes along too. NOTE: this is the player, not
# `libmpv` — the embedded audio path still needs mpv-2.dll (mpv-dev) at runtime.
[[binary]]
name = "mpv"
version = "latest"
[[binary.sources]]
os = "windows"
arch = "x86_64"
url = "https://sourceforge.net/projects/mpv-player-windows/files/64bit/latest/download"
sha256 = "latest"
archive = "7z"
extract = ["mpv.exe", "mpv.com"]
latest = true

