sha256 = "7d8be46ecd31828e1eb7a2ecdd0d6b314feafd82163038ab6092594b0a063539"
archive = "zip"
extract = [
  "whisper-cli.exe", "whisper.dll", "ggml.dll", "ggml-base.dll", "parakeet.dll",
